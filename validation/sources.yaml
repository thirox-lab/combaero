  - film
  content: 'Open access (CC BY-NC-ND), 15 pp. SJTU three-nozzle lean-premixed CH4-air rig, atmospheric, phi 0.6,
    swirl number 0.86 (geometric), nozzle pitch 48 mm, main dp 8.5 %, m_main 0.114 kg/s, T_in 302.3 K. Combustor
    400 x 288 x 106 mm; the effusion plate is the bottom LINER, parallel to the nozzle axes (Fig. 2-3), not the
    dome. Stainless plate t 2.4 mm, 787 holes, 25 staggered rows, d 0.6 mm (t/d 4), Sx/d 6 (spanwise), Sy/d
    9.2 (streamwise); cylindrical vs fan-shaped (10 deg lateral expansion, 1.2 mm cylindrical metering
    length). Inclination printed as 25 deg in the text but 45 deg in Table 1 (unresolved). Coolant 334.7 K,
    1.33-3.32 g/s, BR 1.6, 2.4, 3.2, 4.0 (on the 0.6 mm round area for both shapes, main cross-section
    velocity). Overall effectiveness from cold-side IR (Bi < 0.01), T_main a centreline thermocouple average
    whose value is NOT printed; uncertainty 0.017 in eta. Plotted only: maps (Figs. 11-12), spanwise-averaged
    eta vs Y/D for 2 shapes x 4 BR (Fig. 13), std-dev and gradient vs BR (Fig. 14). RANS CFD (realizable k-eps,
    2-step EDC/FR, DO) for flame structure, near-wall pressure (Fig. 15) and per-row coolant mass split
    (Fig. 16). Data declared confidential.'
  status: screened
  verdict: 'Screened 2026-11-08. Answers the wanted question qualitatively: under a reacting premixed swirl
    flame the eta pattern follows the near-wall gas temperature, not the film -- eta PEAKS where the unburnt
    swirl jet impinges (Y/D about 1) and is lowest in the hot corner recirculation and at the liner tail,
    the reverse of non-reacting swirl. Fan-shaped beats cylindrical by up to 0.051 in eta (more at low BR)
    and is more uniform, which the CFD attributes to shaped holes being more back-pressure sensitive and
    shifting coolant away from the impingement zone. Does NOT give: a front plate (liner only), any gas-side
    h (only CFD), any measured Cd or hole mass split (CFD only), T_main or the near-wall gas temperature, or
    an unambiguous hole angle. Not a usable accuracy set for EffusionPlateElement overall effectiveness or
    in-hole heat pickup: the driving temperature is unprinted and spatially non-uniform (unburnt mixture at
    the wall), so a 1-D plate model cannot be given the boundary condition the data respond to. Qualitative
    only: the shaped-hole gain survives under flame at about +0.05 in overall eta.'
  read_for:
  - 'can-annular front plate with several burners -- not here (liner beside three nozzles)'
  - 'reacting overall effectiveness, cylindrical vs fan-shaped (wanted 2026-11-08) -- here, qualitative only'
