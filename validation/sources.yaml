    1). TR-PIV (0.5-3 kHz, 1500 pairs) on xy, zy, xz planes up to row 7: mean velocity, RMS, vorticity, K-H
    and CRVP structures, instantaneous streamlines and PDFs of jet-maximum height (Fig. 6). Velocity
    uncertainty 4 %. No temperature, effectiveness or heat transfer data; no Cd.'
  status: screened
  verdict: 'Screened 2026-11-08. Flow field only, as the wanted entry expected, and answers its question
    qualitatively: shaped (7-7-7) jets stay attached and stable from row 1 at both dp/P 1 and 3.5 % with
    weaker vorticity and RMS; cylindrical jets are crushed to the wall and oscillate to row 3 at 1 % and lift
    off from row 3 at 3.5 %; both rows shift laterally with the swirl (more for shaped, lower momentum), so
    staggered rows interact. The authors say flat-plate correlations "could be completely ineffective" near
    the dome. Does NOT give: a front plate (liner only), any gas-side h, any effectiveness, any Cd. No usable
    accuracy set for Colban 2011 or any kernel combaero ships -- qualitative support only for treating the
    shaped-hole kernel as less swirl-sensitive in jet trajectory than round holes, and a reason to expect
    the first 3-4 rows behind a swirl stagnation to depart from flat-plate kernels.'
  read_for:
