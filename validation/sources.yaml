  id: CONV-14-123
  topic: [combustion]
  content: 'TEI PreCoDe spreadsheet tool (Kaddah/Freeman liner-hole Cd, Odgers zone efficiency, Lefebvre
    liner heat balance and luminous emissivity, Kadoya air properties Table 1) on a small annular combustor
    at atmospheric rig conditions (Table 3: P3 101.2 kPa, T3 404 K, dP/P 5%, 0.2 kg/s). Measured outer-liner
