  topic: [film, orifice]
  content: 'Word-generated text layer, 262 pp.; data in figures. The console (converging slot-hole) against
    cylindrical holes (d 4 mm, p/d 3), fan-shaped holes (p/d 3.5) and a 35 deg slot at equal throat area per
    width (Fig. 5.2). Ch. 5: low-speed flat plate, DR ~1, v_m 26 m/s, I_ideal 0.5/1.1/1.5, steady TLC:
    laterally averaged eta_aw and h (Figs. 5.27-5.34), net heat flux reduction, and the hole Cd with and
    without crossflow vs Re_h for all four shapes (Figs. 5.38-5.41; with crossflow ~10% below Rowbury''s 40
    deg holes, attributed to the 35 deg inclination). Slot and cylindrical eta and h checked against published
    data (Figs. 5.8-5.11). Ch. 6: transonic annular NGV cascade (CHTT), engine Re/M, foreign gas for DR,
    console vs fan rows, h and eta. Ch. 7: aerodynamic loss. Ch. 9 PRINTS: the Eckert-Drake line-source slot
    model (Eq. 9.1, the Goldstein-Haji-Sheikh form) and point-source hole model (Eq. 9.2), flat-plate Nu
    (9.4/9.5), and two Forth-Jones-parameter fits on her data: console eta = -0.1899 ln[(x/s) I^-2/3] + 1.25
    for 30 < (x/s) I^-2/3 < 200 (Eq. 9.6) and fan-shaped eta = -0.1778 ln[(x/d) I^-2/3] + 0.90 for 4 <
    (x/d) I^-2/3 < 50 (Eq. 9.7), I the actual momentum flux ratio.'
  status: screened
  verdict: 'Screened 2026-11-02. No gap plugged outright. Candidate uses: (a) the fan-shaped eta data and Eq.
