  sha256: '37daa369c0a8ea3a5d2df0de04b261a447d98d8a7bad22e1dbf4e481c44bc68c'
  citation: Meitner, P. L. (1990). Computer code for predicting coolant flow and heat transfer in turbomachinery.
    NASA Technical Paper 2985, AVSCOM Technical Report 89-C-008 (E-5186), Lewis Research Center, September 1990.
  id: NASA TP-2985 (NTRS 19900018406)
  topic: [channel]
  content: 'Scan with OCR layer, 40 pp. The Coolant Passage Flow (CPF) code manual: ONE passage, one inlet and
    one exit (plus a tip-cap bleed and a bypass that leaves and re-enters the same channel), 1-D momentum and
    energy marched along nodes/intervals/slices with area change, mass addition/removal, pumping (radius
    change, rotating frame, relative totals) and heat addition; subsonic except a choked exit (and bypass /
    tip-cap). Friction per interval: user value, trip-strip correlation, input f(Re) curves (pin fin, finned,
    plain), roughened plain-passage correlation, or a total-pressure K factor; heat transfer: internal
    correlations or input curves, a rotation correction (Rayleigh-number based) and user multipliers.
    Derivations in App. B/D, inputs App. C, Rayleigh-line heat-generation option App. E. Examples: (1) a cooled
    radial-turbine flow path (input/output listing); (2) 2:1 area increase and decrease against isentropic
    flow, accuracy vs slice count (converged above ~40 slices; advises < 10% area change per slice); (3)
    constant-area duct, 10 cm2 (d 3.568 cm), Tt 300 K, Pt 100 N/cm2, 0.7874 kg/s (M_in 0.20): Fanno with
    Fanning f 0.10 to M 0.75 needs L = 36.0143 d (128.508 cm), matched at 150 slices; Rayleigh case matched
    in T and p with slice-dependent path lengths.'
  status: screened
  verdict: 'Screened 2026-11-02 (#793). The single-passage code behind the 2004 network procedure (held).
    Its only checks are against closed-form isentropic, Fanno and Rayleigh lines (Tables II-III), which
    combaero''s Fanno-Rayleigh kernel already reproduces from first principles -- so it adds a code-to-code
    benchmark with printed numbers (Example 3 is directly reproducible: Fanning f 0.10, M 0.20 -> 0.75 over
