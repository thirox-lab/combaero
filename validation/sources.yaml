  topic: [film, combustion]
  content: 'Typed scan, 20 pp. (TU Delft library copy); the text layer garbles exponents, read equations from
    page images. Film-side heat transfer: Colburn far field Eq. 2 (x/s > 50), Seban near-slot Nu = 0.090
    [Re_s x/s]^0.7 for m < 1.3 (Eq. 3, Fig. 1), Myers wall-jet Stanton form Eq. 4 reduced at theta = 2 to Nu
    = 0.10 Re_s^0.8 (x/s)^0.44 for m > 1.3 (Eqs. 5-6, Fig. 2 with Cranfield''s own rig data and Pai-Whitelaw).
    Lip-thickness correction factor Eq. 7 and the thick-lip effectiveness eta = 1.10 m^0.65 (mu_c/mu_m)^0.15
    (x/s)^-0.2 (t/s)^-0.2 (Eq. 8, 0.5 < m < 1.3) and eta = 1.28 (mu_c/mu_m)^0.15 (x/s)^-0.2 (t/s)^-0.2 (Eq.
    9, 1.3 < m < 4.0); Figs. 3/4 plot the fitted points (Kacker-Whitelaw, Sivasegaram-Whitelaw, t/s 0.13-1.9).
    Liner balance R1 + C1 = R2 + C2 (Eqs. 10-13) with film C1 (Eqs. 14/15). Worked appendix at x/s 18, t/s
    0.4, m 2.54, 30 atm, 880 K: eta 0.785, Tw,ad 1180 K, h 1.96 kW/m2K, e_m 0.60. Figs. 5/6: thermal-paint
    wall-temperature ranges vs prediction at 22 and 30 atm, combustion efficiency 85-99% by zone.'
  status: implemented
  verdict: 'Screened 2026-11-02; Fig. 1 digitised and Eq. 6 implemented 2026-11-03 (#962). The primary behind
    Lefebvre & Ballal Ch. 8 Eqs. 8.37/8.38 (thick-lip eta, constants identical) and 8.41-8.44 (film-side Nu),
    and of its film-cooled worked example. THE 0.090 IS EXPLAINED (2026-11-03, #962): it is Seban''s curve B
    AS DRAWN and his data (0.134-0.135 in the Stanton form) times Pr 0.69 = 0.090-0.093, not a misprint;
    it is Seban''s printed Eq. 13 constant 0.10 that is the misprint (see the Seban 1960 entry), and the
    book''s 0.069 = 0.10 x 0.69 carries it. Fig. 1 digitised (61 points: 20 Hartnett, Birkebak & Eckert
    1961, 41 Pai & Whitelaw 1971; 59 clean): the data-based Nu constant is 0.0909 pooled (0.0869 Pai &
    Whitelaw, 0.0996 Hartnett; bootstrap 90 % CI 0.0881-0.0938), its own drawn Eq. 3 line 0.0891 at slope
    0.7 (drawn slope 0.73). As a CROSS-SOURCE accuracy set for Seban''s curve B (other labs, m < 1.3, mostly
    below Seban''s m > 1 box): bias -2.5 %, RMS 18 % at Pr 0.69; these data lie 32 % above 0.069.
    FIDELITY POINT, m > 1.3 (Fig. 2, p. 17, read from the page image, not digitised): judged on the
    authors'' OWN data, Eq. 6 over-predicts the film-side h. Eq. 6 is the solid line (theta = 2.0, Nu =
    0.10 X^0.8, X = Re_s (x/s)^0.55); only the Pai & Whitelaw points (ref. 7, m 2.3-3.5, open circles) sit
    on it. The Cranfield rig points (m 1.4-3.5, squares and triangles) lie 20-67% below it at X 2e4-6e4 --
    squares near the theta 1.0-1.6 lines, triangles at or below theta 1.0 -- and close to 0-30% below near
    X 1e5-1.5e5. So Eq. 6 ships only as the named option slot_film_htc_ballal_lefebvre_1973 (it reproduces
    the book''s 1926 W/m2K from the book''s k_a and Re_s); Seban is the default for all m > 1. The worked
    example gives eta 0.785 where the book prints 0.789. Figs. 3/4 are other labs'' points, so they test
    reproduction of the fit; Figs. 5/6 are weak validation (gas T from an assumed efficiency, geometry not
    given).'
