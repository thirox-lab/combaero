    a Marek-Tacina check; (c) the Cd-with-crossflow curves as a film-hole Cd cross-check; (d) laterally
    averaged h with injection against the unblown plate (film-hole gas-side augmentation). All figure-only:
    digitising needed. The console is a proprietary-style shape combaero has no element for. Its Cd lead:
    Rowbury, Oldfield & Lock 2000 (crossflow Cd correlation, wanted).'
