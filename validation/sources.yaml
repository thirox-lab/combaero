- file: sources/orifices/rowbury_oldfield_lock_2001_JT_123_258_external_crossflow_cd_correlation.pdf
  sha256: 'd7e4ed46f7bfa2f1fb74c511c1da5e5eb7bdd18dec8d95e26bbf178528204814'
  citation: 'Rowbury, D. A., Oldfield, M. L. G., Lock, G. D. (2001). A method for correlating the influence of
    external crossflow on the discharge coefficients of film cooling holes. ASME J. Turbomach. 123(2), 258-265
    (ASME Paper 2000-GT-294).'
  id: doi:10.1115/1.1354137
  topic: [orifice, film]
  content: 'Cd of film-cooling holes with EXTERNAL (exit) crossflow, no internal crossflow. Data: an engine HP NGV
    (proprietary, not printed) and its 1.4x replica in the Oxford annular cascade (CHTT, foreign-gas coolant,
    DR 1.77; theta 20-90 deg, orientation alpha 0-60 deg, cylindrical and 12.5 deg fan-shaped holes, AR 2.9-4.0,
    sharp CNC inlets). No-crossflow Cd: Lichtarowicz 1965 Eqs. 1-2 (Cdu = 0.827 - 0.0085 l/d for 2 < l/d < 10,
    Re_h > 2e4) plus Schoder & Dawson Eq. 3 dCd = 3.10 (r/d) Cd for inlet radius. Crossflow: the additive
    outlet loss delta_out = 1/Cd^2 - 1/Cd,no^2 (Eq. 7) at equal Re_h, correlated against the PERPENDICULAR
    outlet momentum flux ratio k_out,perp = rho_h u_h u_h,perp / (rho_m u_m^2) as delta_out = A k^-B - C (Eq. 8),
    A, B, C functions of theta and alpha per vane region and hole shape (Table 2, p. 263, printed as an image:
    pressure surface, leading edge, suction surface; cylindrical and fan-shaped). Solved iteratively with Cd,no
    at the iterate''s Re_h. Fig. 9: predicts Gritsch et al. 1998''s 30 deg cylindrical hole at Mm 0, 0.3, 0.6, 1.2
    with the SUCTION-surface coefficients (a flat wall); over-predicts at low PR, under-predicts near PR 2.
    Figs. 6-8: rows 1, 10, 14 measured vs generalised. No scatter statistics printed.'
  status: screened
  verdict: 'Screened 2026-11-09 (#1074 open gap: exit crossflow). The one printed, angle-general exit-crossflow
    Cd correction: it plugs combaero''s missing exit-side Cd for film and effusion holes (Hay 1983 at Minf 0.31 stays
    +12% with the inclination term on). The model form needs only quantities the elements already have (Cd,no,
    the jet momentum flux, the gas dynamic head, theta), and crossover (delta < 0, Cd raised) is built in. Limits:
    coefficients fitted on one NGV''s rows (curved, accelerating surfaces), so a flat liner takes the suction-
    surface set as the authors did for Gritsch; C > 0 floors delta at -C, so at the large momentum ratios of
    effusion (DLR k_perp ~8-12) it RAISES Cd by ~3-4% -- the wrong direction for DLR''s 1.5x coolant-flow excess,
    which this paper therefore does not explain. Scoring: Gritsch 1998 (held, digitised, same 30 deg geometry the
    authors predict in Fig. 9: cross-source for the coefficients, which come from the CHTT) and Hay 1983 exit-
    crossflow points are the accuracy sets. Internal (inlet) crossflow is not covered (the authors: analogous,
    not done).'
  read_for: ['#1074 exit-crossflow Cd of film and effusion holes', 'Hay 1983 Minf 0.31 residual', 'DLR 2008
      coolant-flow excess (no: wrong sign at high k)']
  issues: [386, 1074]
  records: []
  notes: 'Was on the wanted list as the 2000 ASME paper; this is the journal version. Its ref. [21] corrects the
    Gritsch "ISABE 1997" wanted citation to AIAA J. 36(6), 976-980 (1998). Its refs [22,23] (Hay, Khaldi &
