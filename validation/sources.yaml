- file: sources/orifices/gritsch_schulz_wittig_1998_JT_120_557_expanded_exit_hole_cd.pdf
  sha256: '56ebb4c9396735175648de5489391c45c8fc014ea7db4852d5586b4e014a870a'
  citation: 'Gritsch, M., Schulz, A., Wittig, S. (1998). Discharge coefficient measurements of film-cooling holes
    with expanded exits. ASME J. Turbomachinery 120(3), 557-563 (ASME 97-GT-165).'
  id: ASME 97-GT-165
  topic: [orifice, film]
  content: '7 pp., ASME Digital Collection copy; clean text layer except the figures (read from page images).
    Karlsruhe (ITS) rig, same lab and supply channel as Thole et al. 1997 (held): single scaled-up holes, D 10 mm,
    L/D 6, alpha 30 deg, sharp-edged, smooth; supply channel 20 x 60 mm, COFLOWING (parallel to the main flow).
    Three holes: cylindrical; fan-shaped (14 deg lateral expansion, 30 mm exit width, A_exit/A_inlet 3.0);
    laidback fan-shaped (plus 15 deg layback, 40 mm exit length, AR 3.1); 2D cylindrical inlet length on both
    shaped holes. Table 1: Pt_c up to 2 bar, Tt_c 290 K, Tt_c/Tt_m 1 (0.54-1 tested: no effect at matched Ma_m),
    PR Pt_c/p_m 1-2, Ma_c 0 / 0.3 / 0.6, Ma_m 0 / 0.3 / 0.6 / 1.2, Re_D to 2.5e5 internal, Tu_c 1%, Tu_m < 1.5%.
    Cd DEFINITION (p. 559, equation printed): measured flow over the compressible isentropic 1-D flow from the
    coolant TOTAL pressure Pt_c (1D upstream, 2D off the channel centreline) to the mainstream STATIC p_m (side
    wall 10D upstream; top wall opposite the exit at Ma_m 1.2), on the CYLINDRICAL inlet area pi D^2/4 for all
    three holes, so shaped-hole Cd can exceed 1. Uncertainty (Kline-McClintock): flow 2.5% by orifice, Cd below
    2% in most cases, up to 4.5% at low PR and flow. DATA PLOTTED ONLY, no table and no correlation (the
    correlation is Gritsch et al. 1997, ISABE, not held): Figs. 3-5 cylindrical Cd vs PR at Ma_c 0/0.3/0.6, four
    Ma_m curves each (~8-15 points per curve, markers cleanly separable except near PR 1); Fig. 6 cylindrical Cd
    vs Ma_c at Ma_m 0, PR 1.11/1.24/1.42/1.63 (~10-13 points each); Figs. 7-10 fan-shaped and 11-14 laidback
    (same layout); Figs. 15-18 the three holes overlaid per Ma_m. Read off the page images: cylindrical at Ma_c 0,
    Ma_m 0: Cd 0.72 at PR 1.05 rising about 10% to 0.80 at PR 2.2 (Fig. 3); Ma_m 1.2 drops Cd to ~0.2 at PR
    1.2-1.3, recovering to ~0.78 by PR 2; Fig. 6: Cd 0.74-0.77 at Ma_c 0 rises to a 0.85-0.86 optimum at Ma_c
    0.2-0.35 (lower Ma_c,opt at lower PR), then collapses (0.66 at Ma_c 0.36, PR 1.11). Fan-shaped at Ma_c 0, Ma_m
    0: 0.80-0.82 nearly flat in PR (Fig. 7); with Ma_c 0.3 Cd > 1, peak ~1.13-1.15 at PR 1.07-1.09 (40% above Ma_c
    0, Fig. 10), plateau ~0.90 at high PR; at Ma_c 0.6 an unstable double-bend regime near PR 1.2-1.4 (Figs. 9,
    13). Layback changes Cd negligibly.'
  status: extracted
  verdict: 'Screened 2026-11-02 (#807, #813; was wanted). NO combaero closure is built from it, so nothing here is
    fidelity: every use is cross-source ACCURACY, labelled as such. What it could score: (1) the McGreehan-Schotsch
    Eq. 17 U1/Vi term (orifice::mcgreehan_schotsch::cd, used by EffusionPlateElement when duct-fed via
    crossflow_velocity_ratio) against Fig. 6 (cylindrical, Ma_m 0, ~45 points) and Figs. 3-5 Ma_m 0 curves; but
    two conversions first -- Gritsch references the coolant TOTAL pressure while combaero builds Vi from the
    supply STATIC (orifice.h, item 22), and the hole is 30 deg COFLOW-inclined where McGreehan-Schotsch''s term
    is a tangential (normal-hole, rotation) velocity: the shapes already differ (Gritsch +15% to Ma_c ~0.3, then
    collapse; McGreehan-Schotsch peaks +5.7% at U1/Vi 0.09, then falls), so expect a regime miss, not a tuning
    target (Hay et al. 1983, held, show the same coflow rise). (2) The zero-crossflow Cd(PR) of a plenum-fed L/D 6
    hole (Fig. 3, Ma_m 0: 0.72-0.80) against FilmCoolingElement''s default IdelchikThick or the McGreehan-Schotsch
    chain at L/d 6 (not computed here; the main .venv build is stale). (3) Exit-side grazing flow (Figs. 3-5, Ma_m
    0.3-1.2): combaero has NO exit-side crossflow Cd for film or effusion holes; Rogers-Hersh (#800/#818) is wired
    only into ImpingementPlateElement and is a static-referenced, incompressible, M <= 0.25, normal L/D 1 fit, so
    only the Ma_m 0.3 curves sit near its envelope, and even those need the total/static conversion. (4) Shaped
    holes: FilmCoolingElement hole_type "shaped" takes the METERING diameter -- the same area basis as this Cd --
    but the plain-hole Cd, so it under-predicts shaped-hole flow by up to ~10% without supply crossflow and by up to
    ~40-50% at Ma_c 0.3 and low PR (Figs. 15-18). A real gap, not closable from this paper (no correlation; the
    1997 ISABE correlation is wanted). Data are plotted only: digitise Figs. 3 and 6 first (cleanest); fidelity on
    overplotted near-PR-1 points would be an upper bound. Figs. 3-14 digitised (63 series, 500 marks, 465
    confirmed, 35 provisional collapsed-curve or continuity-deduced marks filed apart; unscored, cross-source
    accuracy only; Cd on the inlet area, same convention as hay1983). Digitised 2026-11-08, user-confirmed
    over three review rounds. Used 2026-11-09 (validation/cooling/hole_cd_inclination_runner.py, cross-source
    ACCURACY, not scored): fig3_Mac0p0_Mam0p0 (the one plenum-to-plenum 30 deg series) against IdelchikThick at
    L/D 6, ideal flow total-to-static to choking on the inlet area, exit 1 atm assumed: mean error +6.4% with
    the angle via length only, -4.3% with the opt-in diagram 3-2 term; the measured rise with PR (0.73 to 0.80)
    is in neither.'
  read_for: ['#807/#813 inlet-crossflow Cd of duct-fed holes vs McGreehan-Schotsch U1/Vi', 'exit-side crossflow Cd
      to Ma_m 1.2', shaped-hole (fan, laidback) Cd for FilmCoolingElement hole_type shaped, 'hole-inclination Cd
      term, 30 deg no-crossflow accuracy']
