# Gritsch, Schulz and Wittig (1998): discharge coefficients of 30 deg
# film-cooling holes -- cylindrical, fan-shaped and laidback fan-shaped --
# with crossflow on the coolant side (Ma_c 0 / 0.3 / 0.6, coflowing) and on
# the mainstream side (Ma_m 0 / 0.3 / 0.6 / 1.2). Figures 3-14; 63 series,
# 500 marks (465 confirmed, 35 provisional).
#
# WHAT THE DATA TESTS. A SHAPED-HOLE Cd, and the effect of coolant and
# mainstream crossflow on it, against the plain cylindrical hole of the same
# rig. combaero has no shaped-hole Cd: FilmCoolingElement hole_type "shaped"
# applies the plain-hole Cd on the METERING area, so on this data it would
# under-predict shaped-hole flow by roughly 4-11 % without crossflow and
# 20-75 % with coolant crossflow (first look, extraction). Every series is
# `scores: null`. It is cross-source ACCURACY data for a future shaped-hole
# closure, to be labelled cross-source when scored; never fidelity (no model
# is built from this paper) and never a tuner.
#
# GEOMETRY. Single scaled-up holes, alpha 30 deg, sharp-edged, smooth;
# D = 10 mm (the cylindrical hole and the cylindrical INLET section of both
# shaped holes); L/D = 6 for all three. Shaped holes: cylindrical inlet 2D
# long; lateral expansion 14 deg (30 mm exit width); laidback adds a 15 deg
# forward expansion (40 mm exit length). Exit/inlet area ratio 3.0 (fan) and
# 3.1 (laidback), areas normal to the hole axis. Coolant channel 20 x 60 mm,
# COFLOWING with the main flow; main channel 90 x 41 mm (32 mm supersonic).
# Air, Tt_c ~290 K, Tt_c/Tt_m = 1; Re_D to 2.5e5; Tu_c 1 %, Tu_m < 1.5 %.
# Figs. 3-5 / 7-9 / 11-13: Cd vs PR at Ma_c 0, 0.3, 0.6 (four Ma_m curves
# each). Figs. 6 / 10 / 14: Cd vs Ma_c at Ma_m 0, four PR levels (legend PRs
# cylindrical 1.11/1.24/1.42/1.63, fan 1.09/1.25/1.41/1.62, laidback
# 1.10/1.25/1.40/1.60; geometry key pressure_ratio_pc0_over_pinf).
#
# THE CD DEFINITION -- coolant TOTAL to mainstream STATIC, on the INLET area.
# Cd = m_dot / m_ideal, m_ideal the isentropic 1-D flow from p_tc to p_m
# printed on p. 559:
#   m_ideal = p_tc (p_m/p_tc)^((k+1)/2k)
#             sqrt(2k/((k-1) R T_tc) ((p_tc/p_m)^((k-1)/k) - 1)) pi D^2/4
# The reference area is pi D^2/4 on the INLET (metering) diameter for ALL
# THREE holes, so a shaped-hole Cd can exceed 1. p_tc, T_tc 1D upstream of
# the hole inlet, 2D off the channel centreline; p_m on the side wall 10D
# upstream of the exit (subsonic) or the top wall opposite the exit (Ma_m
# 1.2). Same pressure pair as Hay et al. (1983), so declared in
# conventions.py under the same Cd_coolant_total_exit_static.
#
# UNCERTAINTY (Kline-McClintock, the paper's own): flow by orifice 2.5 %; Cd
# below 2 % in most cases, up to 4.5 % at low PR / low flow. A measurement
# band, but PR-dependent, so `uncertainty` is null on every series (one
# scalar would misstate it), as for hay1983.
#
# DIGITISATION (2026-11-08). The scan is a 1-bit 300 dpi raster, no vector
# data. Automated symbol detection by template (gnuplot-style markers: the
# point is the template origin, a triangle's at 0.69 of its height below the
# apex), then three user review rounds on scan overlays on 2026-11-08, every
# figure confirmed; the user's decisions are recorded per point in each
# CSV's note column. The scan and overlays are not committed.
#
# CALIBRATION. Each panel calibrated on its printed dotted grid lines (ticks
# are 1 px and partly lost), two half-bands per axis, affine fit (absorbs the
# 0.1-0.2 deg page skew); linear axes. Grid residual max 0.0002-0.0017 per
# axis. Frame edges read through the fit agree with the numbers printed at
# those corners to 1-3 px (e.g. Fig. 13: left 1.0008, right 1.9970, top
# 1.0999, bottom 0.5001). The right frame of every PR panel reads 2.0 -
# 0.003..0.004 with clean grid fits: the drawn frame, not the scale. +-1 px
# is +-0.001-0.002 in Cd. calibration_grid.json holds the per-panel fit
# (grid-line pixel positions, coefficients, residuals, edge checks); it is
# committed but NOT listed under `files:`, as calibration files are in
# rohde1969 and hay1983.
#
# CSV COLUMNS. x, y, class_confidence, note. The loader reads x and y only;
# the other two columns carry the per-point review record, verbatim.
# provenance/ keeps the digitiser's per-point record (marker, pixel position,
# template match score) for every original series, unlisted.
#
# CLASS LABELS -- SPLIT, NOT MIXED. The schema carries class_confidence per
# series, so each digitised series is filed as a confirmed CSV plus, where it
# has any, a `_provisional` CSV holding the points whose series was deduced
# from curve continuity, or that sit where several curves COLLAPSE onto one
# another (Figs. 7, 9, 12). The collapsed points are kept on the user's
# instruction -- the collapse is itself data -- and are deliberately the same
# coordinates in each series that passes through them. Use them pooled or as
# a record of the collapse, never as read symbols. Values are exactly as
# digitised; nothing is corrected.
#
# NOT HERE. Figs. 15-18 regroup the same 36 PR curves by Ma_m and were not
# digitised separately. No correlation is printed (the authors' 1997 ISABE
# correlation is not held).

paper:
  name: gritsch1998
  citation: >-
    Gritsch, M., Schulz, A. and Wittig, S. (1998). "Discharge Coefficient
    Measurements of Film-Cooling Holes With Expanded Exits." ASME J.
    Turbomachinery 120(3), 557-563. Paper No. 97-GT-165.
  secondary: false

