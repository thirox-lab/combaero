- file: sources/orifices/hay_lampard_1996_ASME_96-GT-492_cooling_hole_cd_review.pdf
  sha256: '710140f0d62581d7367df4ce1744dfd0767dd5f6d64ac5f0e2dcb0439e1d783a'
  citation: 'Hay, N., Lampard, D. (1996). Discharge coefficient of turbine cooling holes: a review. ASME 96-GT-492
    (Proc. ASME Turbo Expo 1996, Vol. 4, V004T09A056).'
  id: ASME 96-GT-492
  topic: [orifice, film, review]
  content: 'Review of cooling-hole Cd: Table 1 classifies the literature by geometry and inlet/outlet crossflow.
    Fig. 3 (p. 4): Adkins & Gueroui (1986) measured Cd of SHORT combustor cooling holes against the flow
    parameter (p_c - p_inf)/(p_c+ - p_c), with McNown & Hsu''s potential-flow prediction. Fig. 4 (p. 4): normal
    holes with INLET crossflow, Cd against the velocity head ratio (p_c+ - p_inf)/(p_c+ - p_c) -- Rohde et al.
    1969, Benmansour (thesis), Byerley 1989 collapse on one curve (Cd ~0.2 at 1.2 rising to 0.8-0.85 above
    ~20) with a potential-flow line; the text: this parameter "has been shown to work over a wide range of inlet
    cross flow Mach numbers for orifices with L/d > 2" (p. 5). Fig. 5: McGreehan-Schotsch inlet-radiusing
    correction against Hay & Spencer (1992) data. Discusses Rogers & Hersh''s lid model (short normal holes,
    empirical), the additional-loss method, CFD.'
  status: screened
  verdict: 'Screened 2026-10-28 (#807, #813). Fig. 4 gives the inlet-crossflow Cd of normal holes with L/d > 2 as
    one curve over three sources (incl. the Benmansour thesis points): the velocity head ratio is (Vi/U1)^2, so it
    maps onto McGreehan-Schotsch''s U1/Vi (= 1/sqrt(ratio)) -- a cross-source ACCURACY check of the shipped
    duct-fed-hole Cd once digitised (~50 points); it also settles that L/d (>2) hardly matters under inlet
