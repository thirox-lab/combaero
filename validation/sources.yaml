    International Conference on Metallurgical Coatings and Thin Films, San Diego, April 2000.
  id: NASA/TM-2000-210238 (NTRS 20000088491)
  topic: [other]
  content: 'Scan with OCR layer, 24 pp. GE-made EB-PVD ZrO2-8wt%Y2O3 on Rene N5 disks with a PtAl bond coat
    (flat or laser-grooved), top coat 0.13, 0.25 and 1.0 mm. Steady-state laser heat-flux rig, 1-D model with
    a T-dependent substrate k (Fig. 2 shows the interface-temperature error a constant metal k causes;
    the error grows for thin, high-conductance coatings). Table 1 conditions: 0.13 mm, 2 h cyclic, 220 W/cm2,
    T_surface 1280 C / T_interface 1095 C; 0.25 mm isothermal, 143 W/cm2, 1250/1020 C; 1.0 mm isothermal, 69
    W/cm2, 1350/860 C. ABSOLUTE conductivity is plotted only for the 0.13 mm coatings (Fig. 3b): about 1.55-1.65
    W/m K at the start, rising to about 1.7 in 50 h with fluctuations from micro-delamination; Fig. 4 (0.13 mm
    grooved, 200 h) is NORMALISED to an assumed initial 1.5 W/m K ("typical EB-PVD"), ending near 1.8. Fig. 3a
    (0.25, 1.0 mm) is k/k0 only, rising to ~1.05-1.10 in 25 h. Fig. 5: ln[(k - k0)/(k_inf - k0)] = 3.07 -
    24881/T_ave (T_ave in K, R2 0.983, four points, 1e4/T 6.85-7.4); k_inf and the time units are not stated.
    Sintering strain at the surface fitted as 0.40757 + 0.41 t^0.2 (% , t in h; Fig. 7, as printed). Intrinsic
    ZrO2-8Y2O3 k quoted as about 2.5 W/m K. No table of k values.'
  status: screened
  verdict: 'Screened 2026-11-02 for #761. A public NASA EB-PVD conductivity source, but a weak one for citing
    k_tbc_ysz(is_ebpvd=True): absolute values only for 0.13 mm coatings at one condition (mean coating
    temperature ~1190 C), about 1.55-1.65 W/m K as deposited -- below the legacy fit''s 1.5 + 0.0002 x 1190 =
