# Hay, Lampard and Benmansour (1983): discharge coefficient of a row of
# film-cooling holes with crossflow on BOTH sides -- coolant (inlet) Mach
# number Mc and mainstream (exit) Mach number Minf varied independently --
# at hole angles of 30 and 90 deg, coolant duct parallel or perpendicular to
# the mainstream. Figures 5, 6, 8, 11, 12 and 15; 25 series, 174 marks.
#
# WHAT THE DATA TESTS. The only measured data in this project on (i) a HOLE
# ANGLE term in Cd and (ii) the DIRECTION of the coolant crossflow relative
# to the hole's lean. No combaero closure carries either, so every series is
# `scores: null`: it is cross-source ACCURACY data for a future closure (and
# must be labelled cross-source when scored), never fidelity -- fidelity
# applies only to a model built from this paper, and none is. Nothing is
# tuned to it. See extractions/hay_1983_crossflow_cd.md.
#
# GEOMETRY. D = 3.5 mm, four holes in one row, S/D = 2.5, L/D = 6 in every
# published figure (L/D 2 was tested in the parallel rig but not published
# as data). alpha = angle of the hole axis to the mainstream; in the parallel
# rig the 30 deg hole leans downstream WITH both streams, in the
# perpendicular rig the coolant runs at 90 deg to the hole's lean plane.
# Inlet edge not stated for the test plate (read as sharp from p. 244).
# Room-temperature air, hole Re 1e4-1e5 (not printed per point).
#
# THE CD DEFINITION -- coolant STAGNATION to mainstream STATIC. Ideal flow is
# "based on the coolant stagnation pressure and mainstream static pressure"
# (p. 245); the abscissa of Figs. 5-12 is PR = pc+/p_inf on the same pair
# (x_axis pc0_over_pinf). Fig. 15's abscissa is the velocity ratio u_j/u_inf
# (x_axis uj_over_uinf). Declared in conventions.py as
# Cd_coolant_total_exit_static, distinct from Rohde's and McGreehan-Schotsch's.
#
# UNCERTAINTY. Table 3 is a real MEASUREMENT band, but it depends on PR: at
# Minf 0.3, 8-3.5 % for 1.01 < PR < 1.2, 3.5-1.5 % for 1.2-1.5, 1.5 % above
# 1.5 (one-sided crossflow ~6 / 2.5 / 1.5 %). The schema's `uncertainty` is
# one scalar per series, which would misstate it either way, so it is null
# on every series and the band lives here and in the extraction.
#
# DIGITISATION (2026-11-08). Automated first pass on the native 300 dpi 1-bit
# scan, every candidate reviewed, missed marks picked by hand; user-confirmed
# on scan overlays (scan + calibrated frame + points + numbered suspects) on
# 2026-11-08 ("all figs okay"). The scan and overlays are not committed.
# Calibration: axes fitted as lines, ticks as short perpendicular runs, a
# linear map per axis; every printed tick reproduces to <= 0.0025 (Fig. 15
# y: 0.0049), so both axes are LINEAR on every figure.
#
# WHY THE NUMBERS ARE UNCORRECTED -- THE DRAFTING SLANT. The axes are not
# perpendicular: the y axis leans -0.35 to -0.95 deg in every panel while the
# x axis tilts -0.20 to +0.38 deg. A page rotation would tilt both equally,
# so this is a drafting shear, not scan rotation, and it is NOT removed by a
# rotation. The map is oblique: constant-PR lines run parallel to the drawn
# y axis, constant-Cd lines parallel to the drawn x axis. Column x is that
# reading. Column x_perp is the alternative (constant PR perpendicular to the
# x axis), kept as the sensitivity: it is +0.002 to +0.008 higher in PR,
# largest at the top of Figs. 6/8; Cd is unaffected. The loader reads x and y
# only.
#
# CALIBRATION FILES (fig<N>_xticks.csv, fig<N>_yticks.csv, fig<N>_corners.csv)
# are committed alongside but deliberately NOT listed under `files:`, as in
# rohde1969/florschuetz1981: they are calibration, not measurement. ticks
# rows give the printed value, its pixel position, how it was found and the
# fitted value; NOT-FOUND(pred) ticks (Figs. 11, 12) are predicted, not seen.
#
# THIRD CHANNEL. Figs. 5 and 6 both plot the same run (crosses, Minf .31,
# Mc .29). Digitised independently in the two panels, all 7 marks agree to
# |dPR| <= 0.010 and |dCd| <= 0.009 (mean ~0.005).
#
# CLASS LABELS. fig6_unassigned_open_square is ONE mark whose series is
# unknown (an open square-like symbol on the Mc .09 curve); it is filed
# `class_confidence: disputed` -- pooled use only. fig12_filled_squares is
# `provisional` for one mark (flag #4). Flagged marks (merged with another
# symbol or a curve, or in the overplotted PR 1.9-2.1 clusters of Figs. 6
# and 12) are kept and listed in each series' cross_check; their position is
# a blob centre, biased along the curve where merged. Pointer symbols sit at
# their blob centroid (the flag body, not the tip).
#
# NOT HERE. Fig. 7 (vs Rohde, Minf 0) was not digitised: its symbols are
# printed over Rohde's and could not be separated. The plateau carpets
# (Figs. 9, 10, 13, 14) are printed NUMBERS, not points; they are transcribed
# in the extraction, with two suspected misprints flagged there. Fig. 15's
# "Prediction" curve is the authors' model, not data. Fig. 11's caption
# ("at Minf = .3") is a misprint; its legend varies Minf at Mc ~0.29.

