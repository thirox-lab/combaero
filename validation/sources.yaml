  citation: Schneider, S. J. (2015). Analysis of turbine blade relative cooling flow factor used in the subroutine
    Coolit based on film cooling correlations. NASA/TM-2015-218738 (E-19070), Glenn Research Center.
  id: NASA/TM-2015-218738 (NTRS 20150011643)
  topic: [film, review]
  content: '30 pp., Word-generated text layer. Explores the Coolit relative cooling flow factor (FAC; Gauntner''s
    NASA TM-81453 algorithm for turbine cooling flow and the efficiency penalty) with flat-plate correlations.
    Convection-cooled blade: turbulent flat-plate gas side and Dittus-Boelter 0.023 Re^0.8 Pr^0.4 coolant
    passages. Film-cooled blade: Lefebvre''s Ch. 8 slot set -- Nu = 0.069 [Re_s x/s]^0.7 for 0.5 < m < 1.3
    (its Eq. 19), eta = 0.6 (x/ms)^-0.3 (Re_s m mu_c/mu_g)^0.15 for x/s < 150 (its Eq. 24), and the wall-jet
    set; the appended Fortran also switches to eta = 1/(0.6 + 0.05 x/(ms)) (its Eq. 30). Wall model: zero wall
    thickness, no axial conduction. Inputs echo the Lefebvre worked example (gas 2280 K, coolant 880 K, gas
    Mach 0.6). Results: wall temperature against the film split of the total cooling flow; no film (all
    convection) cannot control the blade temperature, and below ~25% in convection the design nears the
    convection limit (thermal effectiveness eta_conv, Esgar et al. TN D-5992). Coolit''s own cooling-
    effectiveness curve (its Eq. 1) is a curve fit to Livingood et al. TM X-2384 Fig. 23 (a full-coverage
    film-cooled vane).'
