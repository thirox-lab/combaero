  id: NASA-CR-2681
  topic: [orifice, acoustics]
  content: 'Measured steady discharge coefficient of single square-edged wall holes under a turbulent
    grazing flow, BOTH directions. NOTE the paper''s terms: its "inflow" (grazing stream into the cavity)
    is a suction/bleed hole, its "outflow" an injection hole. Cd_De is referenced to the grazing STATIC
    pressure, incompressible (Eqs. 20-24, p. 11). D 1-12.7 mm, L/D 0.12-2.0 (3.14 without grazing, App.
    E), delta about 9 mm (delta/D 0.7-9), V_inf 12.9-85 m/s (M <= 0.25), Vi/V_inf 0.004 to about 0.9.
    Fig. 11 (p. 41, D 12.7 mm, L/D 1): fits Cd = 0.8 (Vi/V_inf)^0.47 suction, 0.97 (Vi/V_inf)^0.534
    injection, about 10-15 clean points per direction; crossing near Vi/V_inf 0.05, injection higher
    above. L/D strongly affects suction Cd at every ratio, minimum at L/D 0.6 (Figs. 18-19), injection
    not below Vi/V_inf 0.35-0.5 (Fig. 17); resistance ~ (delta/D)^-0.2 (Figs. 15-16). A lid model (Eqs.
    11, 19, App. D). Figs. 13-14 replot Feder (P&W) hole-cluster data. Data plotted only, no tables. PDF
    page = printed page + 6.'
  status: implemented
  verdict: 'IMPLEMENTED 2026-10-28 (#800) as the DEFAULT impingement-hole crossflow Cd (ImpingementPlateElement
    cd_crossflow=''rogers_hersh_1976''): the Fig. 11 fits resolved in q = G_ideal/G_c, capped C1 at the hole''s own
    Cd; Florschuetz 1981 arrays bit-identical, CR-3630 D.1 worst row 0.111 -> 0.085 (z/d >= 2), #799 alternation
    gone; cross-source (ACCURACY) for any impingement plate. Screening: plugs the gap: measured
    suction AND injection Cd down to Vi/V_inf 0.004, where CR-3630 D.1 B(5,4,1)''s stagnant rows sit
    (Gc/Gj ~125, Vi/V_inf ~0.008: Cd ~0.08 both ways by the fits, against the constant 0.85 used). Suction
    is not much lower than injection there, so a reverse-only Cd does not follow from it. Cd ~ (Vi/V_inf)^0.5
    makes the hole resistance LINEAR in dP under strong grazing flow (Vi ~ dP / V_inf), which would remove
    the sqrt(dP) singularity behind the #799 alternating mode -- an inference, untested. McGreehan-Schotsch
