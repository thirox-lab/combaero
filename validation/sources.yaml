  id: Kaddah 1964 (Cranfield DAE thesis), Vol. 1
  topic: [orifice, combustion]
  content: 'Scan with a text layer, 119 pp.; the OCR is usable for the prose only -- read equations and tables
    from the page images. Flush, square-edged holes in a 1/16 in (0.0625 in) aluminium plate in the floor of
    a 1.25 in high x 8 in wide perspex duct, discharging into a plenum (bleed orifice) or to atmosphere; jets
    with the duct flow parallel to the plate (supply-side crossflow). 20 configurations (Section 7.3): circular
    C1-C5 (d 0.329-1.59 in, area ratio a* = hole/duct area 0.0595-0.595, d/t 5.25-25.4, i.e. t/d 0.04-0.19),
    oval O1-O7 and rectangular R-slots (aspect ratio 1-8, a* 0.0595-0.604, slot major dimension up to 2.1 in
    -- longer than the duct depth for the largest). Approach velocity V1 = 0 (no crossflow), 80 and 130 ft/s
    (duct Mach about 0.07-0.12, incompressible), p1/pj up to 1.12, flow parameter K = (P1 - pj)/(P1 - p1)
    about 1.5-170, bleed ratio alpha to about 0.4. TABLES 11-30 (PDF pp. 99-118, one per configuration)
    TABULATE every measured point: p1/pj, alpha, mu = alpha/a*, L1, Lj, rho1, V1, rhoj, Vj, Lth, C, K, the
    measured jet deflection angle phi (deg, from the plate) and the momentum loss factor delta -- about 15
    points per configuration, about 300 in all; no digitising needed. C = Lj/Lth with Lth = rho_j Vj A_h and
    Vj from (P1 - pj) (Appendix 2), i.e. Cd referred to the approach TOTAL pressure and the jet static, the
    Phi convention of TN 3663. Section 6: two 1-D momentum analyses; Analysis I (Eqs. 8-13) gives C and phi
    from K, alpha and a*; Analysis II adds an axial momentum loss factor delta (mean 0.8, Eqs. 28/29).
    Tables 1-10 tabulate the theory. Appendix 4: a fit to Gandamihardja (1962) deflection angles. Vol. 2
    (separate file) holds the figures, 125 + 26 appendix + 24 plates.'
  status: screened
  verdict: 'Screened 2026-11-06 (was wanted, #807). THE PRIMARY OF LEFEBVRE & BALLAL Eq. 4.15 / Fig. 4.2,
    confirmed: the book''s (K - 1)/[4K^2 - K(2 - alpha)^2]^0.5 is Kaddah''s Analysis I Eq. 11; the book''s
    leading 1.25 is not in Eq. 11 and is presumably the delta = 0.8 of Analysis II (1/0.8 = 1.25) -- check the
    algebra of Eqs. 26-29 before implementing. The book calls it an MSc thesis; it is a DAE thesis. PLUGS A
    GAP for #807: the shipped supply-crossflow Cd (McGreehan-Schotsch Eq. 17) is scored only on Rohde''s thick
    hole (L/d 1.06); TN 3663 (registered) adds thin liner holes but only as rough figure reads. Kaddah gives
    the thin-wall case (t/d 0.04-0.19) TABULATED, five hole sizes at fixed t, two crossflow velocities --
    the cleanest cross-source ACCURACY set for Eq. 17 at liner geometry (Cranfield, not NACA Lewis). Caveat:
    t/d and a* change together (C1-C5 vary d at fixed t), so a wall-thickness term cannot be separated from
    the area-ratio (bleed) effect inside this set; large a* (0.25-0.6) and slots longer than the 1.25 in duct
    depth are outside any liner annulus, so score the small-a* configurations first. FIDELITY set for a
    Kaddah Cd(K, alpha) closure if one is implemented (his own Tables 11-30 vs his Eqs. 11/13 or the
    book''s 4.15). #813: the measured deflection angle phi is the direct test of Report 1373 Eq. 9 (cos phi =
    V_A/V_j, the jets keep the whole supply axial velocity). Indicative, read off Table 11 (C1; 10 crossflow points, not transcribed): at V1 130 ft/s, Vj
    218-487 ft/s, Eq. 9 gives 53/64/70/72/75 deg vs measured 62/69/71/71/72; at 80 ft/s, Vj 135-468, Eq. 9
    54/71/76/79/80 vs measured 66/70/72/73/75. So the jets are 9-12 deg STEEPER than Eq. 9 at the lowest K
    (keep less axial velocity) and up to 7 deg SHALLOWER at high K (keep more): Eq. 9 is not a bound either
    way, and #813''s from_crossflow mode should be scored against these tables, not assumed. Non-circular slots: oval and rectangular
    data (Dittrich TN 3924 covers rectangular only; no oval data elsewhere in the register).'
  read_for: ['#807 thin-wall liner-hole Cd under supply crossflow (cross-source accuracy for McGreehan-Schotsch
      Eq. 17)', 'primary of Lefebvre & Ballal Eq. 4.15 / Fig. 4.2', '#813 jet deflection angle vs Report 1373
