- file: sources/heat_transfer/film/Simon_1986_NASA_TP-2655_slot_film_jet_model_turbulence.pdf
  sha256: '3671431a228d575f1b649e2235769fd2ddbf7855b453cdbffaf7e0f507afc507'
  citation: Simon, F. F. (1986). Jet model for slot film cooling with effect of free-stream and coolant
    turbulence. NASA Technical Paper 2655 (E-2961), Lewis Research Center, October 1986.
  id: NASA TP-2655 (NTRS 19870008601)
  topic: [film, combustion]
  content: 'Scan, no text layer, 21 pp. (equations and tables read from page images). Wall-jet model of a 2-D
    slot film: an initial region x < x1 (zone II coolant core being entrained into, zone I mixing layer) and a
    fully developed region x >= x1 (adiabatic wall = mixed jet temperature). Composition, cp and T_inf constant,
    no radiation. General form Eq. 32: eta = 1/(1 + (x/(M S)) C_M''), C_M'' = (C_M - beta/(x/(M S)))/(1 + beta)
    (Eq. 33); beta = 0 and C_M'' = C_M for x >= x1, so the developed region IS the Juhasz-Marek / Marek-Tacina
    form eta = 1/(1 + C_M x/(M S)) (Eq. 9). Mixing coefficient from Abramovich jet growth db/dx ~ a_o v''/U*
    with U* the density-weighted velocity (Eqs. 14-21): C_M = a_o (I_v omega)^N, omega = (1 + T_inf/T_s)/(1 +
    M) (Eq. 41). FITTED (Figs. 3-4): N = 0.65, a_o = 0.177, i.e. C_M = 0.177 (I_v omega)^0.65 (Eqs. 29/35/39)
    for I_v,inf = 0.026-0.13, both regions; at I_v,inf = 0.244 the developed region uses C_M = [0.245 (1 -
    x1/x) + 0.177 x1/x] (I_v omega)^0.65 (Eqs. 30/40). Effective lateral intensity I_v = I_v,inf + 0.4
    |I_v,inf - I_v,s| (Eqs. 23/42, after Ko & Liu 1980), capped at no more than both I_v,inf and I_v,s (as
    printed); I_v = v''/U_inf is the TRANSVERSE (lateral, wall-normal) intensity referred to the free-stream
    velocity, NOT the axial Tu Marek-Tacina use. Initial region: beta (Eq. 34) = [C_M x/(M S) + x/x1 - 13.7
    I*_v,s (T_s/T_aw,x1) ln(1/(1 - x/x1))] psi, psi = (T_aw,x1 - T_aw)/(T_inf - T_s), I*_v,s = v''_s/U_s the
    coolant intensity on coolant velocity (A50); C_o = 13.7 fitted with I*_v,s = 0.089 (one value, from a
    1985 personal communication with Marek). Core length Eq. 36: x1 = 1/((C_M/S) F(R)), F(R) = 1/(1/((T_s/
    T_aw,x1)(0.416 + 0.134 R)) - 1), R = U_inf/U_s (Abramovich), iterated (App. B flow chart, start x1 = 20 M
    S). Table I prints x1 (cm) and x1/(M S) calculated vs experimental (calc. 12.4-41.9; exp. 8 to 39, several
    only bounds ">16"); Table II prints per run M, I_v,s, I_v, d phi/dx, omega. DATA: none new -- all of it is
    Marek & Tacina 1975 (TN D-7958, ref. 3; 62 m/s, 590 K, 1 atm, coolant ambient, 10.5 x 37 cm duct, 8 of 9
    stations, the 9th dropped for conduction), I_v,inf = 0.026/0.08/0.13/0.244 for its four blockage plates,
    M 0.41-1.86. Jet I_v,s measured only at M = 1.85 (0.119), the other M assume a constant exit intensity
    (0.033-0.090). Fig. 5: prediction vs data, average deviation +-4% (the abstract says: lateral Tu up to 24%,
    M up to 1.9). Fig. 7: coolant Tu (I*_v,s 0.01 vs 0.09) changes eta only in the initial region, more at low
    free-stream Tu.'
  status: screened
  verdict: 'Screened 2026-11-02 for #714 stage 2. It is the ONLY printed turbulence closure for this slot film
    beyond Marek-Tacina Eq. 5, but it does NOT plug the gap as an independent source: its constants (a_o 0.177,
    N 0.65, 0.245, C_o 13.7) are fitted to the SAME D-7958 data the shipped kernel is fitted to, so the +-4% is
    a fit residual on the fitting set, not cross-source accuracy (and D-7958 Table I is the only data it can be
    scored on -- a fidelity check of an implementation, never an accuracy claim). What it adds over Eq. 5: (1)
    a blowing-ratio and temperature-ratio dependence of C_M through omega (my arithmetic from its Table II: at
    the 0% plate C_M 0.027 at M 0.45 vs 0.030 at M 1.85; at the 90% plate 0.103 vs 0.072, against Eq. 5''s
    single 0.0175 and 0.0875 at axial Tu 7%/35%); (2) the coolant turbulence term, but only through the
    initial region and with one assumed coolant intensity; (3) a printed potential-core length x1 (x1/(M S)
    ~12-42 calculated, longer than much of the D-7958 span), which the kernel lacks. Can it replace or calibrate
    C_m(Tu)? Not directly: its input is LATERAL I_v = v''/U_inf (0.026-0.244 on the plates whose AXIAL Tu is
    7-35%, ratio ~0.37-0.70, rig-specific), which a user rarely knows, plus T_inf/T_s and I_v,s; an axial-to-
    lateral conversion would be a tuning assumption. Usable as a declared alternative closure on D-7958 Table I
    (the one dataset it was built on), with the Marek-Tacina Tu box; the cross-source accuracy question for
    either closure stays open (needs another lab''s slot data with measured Tu: Ballal & Lefebvre 1973 SME 4,
    Sturgess 1977/1980). Not checked: whether D-7958 itself prints the lateral intensities (Simon''s I_v,inf
    values were not traced in it); the asymmetry between Eq. 7 ((x1 - x)/x1) and Eq. 13 ((x1 - x)/x) is as
    printed, Eq. 34 uses the Eq. 31 simplification. Not implemented.'
  read_for: ['#714 stage 2 slot-film turbulence closure (free-stream and coolant Tu)', '#714 near-slot
      potential-core length']
  issues: [714]
  records: []
  notes: 'Fetched 2026-11-02 from NTRS (19870008601, public). Leads: Sturgess & Lenertz 1977 (ASME 77-HT-10,
    mainstream Tu), Sturgess 1980 (J. Eng. Power 102, 524, film/coolant Tu), Sturgess & Pfeifer 1986 (J. Eng.
    Gas Turbines Power 108, 361, film initial region), Ko & Liu 1980 (AIAA J. 18, 907), Marek 1973 (NASA TM
    X-2809, film effectiveness independent of pressure 1-20 atm), Juhasz & Marek 1971 (TN D-6360).'
- file: sources/heat_transfer/film/Hatch_Papell_1959_NASA_TN_D-130_slot_film_heat_sink_model.pdf
  sha256: 'abcb2711122db9d81a3fef65499d0a3854ba1b14e9004467cd89fd69e7f3af56'
  citation: Hatch, J. E., Papell, S. S. (1959). Use of a theoretical flow model to correlate data for film cooling
    or heating an adiabatic wall by tangential injection of gases of different fluid properties. NASA TN D-130,
    Lewis Research Center, November 1959.
  id: NASA TN D-130 (NTRS 19890068390)
  topic: [film]
  content: 'Scan with an OCR text layer (exponents unreliable; equations read from page images), 44 pp.
    Tangential slot film on an adiabatic wall. Model: coolant a discrete unmixed layer heated by the main gas
    with the duct h = 0.0265 (k_f/D_h) Re_f^0.8 Pr_f^0.3 (properties at the mean of gas and slot-exit static
    temperature, D_h of the duct), giving eta = (T_ad - t_w)/(T_ad - t_c) = exp[-h L (x - x'')/(w cp)_c] (Eq.
    4), eta = 1 for x <= x''. Fitted: x'' = 0.04 (w cp)_c/(h L) (Eqs. 6, 8). Final correlation Eq. 12: ln eta =
    -[h L x/(w cp)_c - 0.04] (S V_g/alpha_c)^0.125 f(V_g/V_c), for h L x/(w cp)_c > 0.04 (eta = 1 below, Eq.
    12a); alpha_c the coolant diffusivity at slot-exit static temperature, V_g used in place of V_c in the
    0.125 group; f = 1 + 0.4 arctan(V_g/V_c - 1) for V_g/V_c >= 1 (Eq. 10, radians), f = (V_c/V_g)^(1.5
    (V_c/V_g - 1)) for V_g/V_c <= 1 (Eq. 11). L is the cooled perimeter (width), w the coolant flow. Data:
    NASA 8 x 8 in. duct with AIR (from Papell & Trout 1959, TN D-9, not held; Figs. 6-9, S 1/16-1/2 in.) and
    HELIUM (new, Figs. 10-12, TABLE I printed, S 1/8-1/2 in.); General Electric 18 in. square duct, S 0.106
    in. (Chin et al. 1958, ASME 58-A-107; Figs. 13-14, film heating included). Range (NASA + GE): T_g 502-1965
    R, V_g 104-1040 ft/s, V_g/V_c 0.45-33.3, T_c 530-980 R, S 0.063-0.50 in. Accuracy (Fig. 15): wall
    temperature within about +-5%; coolant flow up to 60% off near the eta -> 1 end (Fig. 16). The authors say
    Eq. 12 is pessimistic below eta ~0.3. Free-stream turbulence not measured or mentioned. Eq. 13 + a worked
    example invert it for coolant flow.'
  status: screened
  verdict: 'Screened 2026-11-02 for #714. The heat-sink slot-film model that Wambersie & Ireland 2023 build on,
    in its original printed form (the wanted entry''s exp[-hL(x - x'')/(m cp)] is Eq. 4, the
    un-corrected model; the usable correlation is Eq. 12 with the 0.04 offset, the (S V_g/alpha_c)^0.125 group
    and f(V_g/V_c)). Not a turbulence closure: no Tu input at all, so it cannot calibrate Marek-Tacina''s C_m(Tu)
    and is not interchangeable with it (its decay is exponential in an h-based length, Marek-Tacina''s is
    algebraic in x/(M S)). Its value: (1) the HELIUM-coolant TABLE I is a printed, strongly property-different
    slot-film dataset (coolant density and cp very different from air) -- a candidate cross-source ACCURACY
    check of the slot-film element''s property handling, but Marek-Tacina needs a Tu the NASA rig did not
    report, so any score carries an assumed Tu; (2) a declared alternative closure family (heat-sink) for low
    or unknown turbulence, never a default. Fidelity of an Eq. 12 implementation would be judged on Table I
    (helium); the air data are in TN D-9 (not held). Not implemented.'
  read_for: ['#714 slot film: heat-sink model and property-ratio (helium) data']
  issues: [714]
  records: []
  notes: Fetched 2026-11-02 from NTRS (19890068390, public). Sequel Papell 1960 TN D-299 (held). Air data
    primary Papell & Trout 1959 NASA TN D-9 (on NTRS, not fetched).
- file: sources/heat_transfer/film/Papell_1960_NASA_TN_D-299_angled_slots_normal_holes.pdf
  sha256: 'a10562c650de859aecaf57087974e8decc2b3a7782bc0ed6966ff908586142cf'
  citation: Papell, S. S. (1960). Effect on gaseous film cooling of coolant injection through angled slots and
    normal holes. NASA TN D-299 (E-689), Lewis Research Center, September 1960.
  id: NASA TN D-299 (NTRS 19980231068)
  topic: [film]
  content: 'Scan with OCR layer, 30 pp. Same 8 x 8 in. NASA duct, adiabatic top wall, T_g 1500 R. Slots at
    nominal 30/60/90 deg discharging (water check) at i = 45/80/90 deg, slot height 1/4 in. normal to the guide
    walls, M_g 0.2-0.7, V_g/V_c 0.53-17.5; and two or four staggered rows of 1/4 in. NORMAL holes on 1/2 in.
    centres (M_g 0.3-0.7, V_g/V_c 0.49-21.8). Effective angle Eq. 1: i_eff = arctan[sin i/(cos i + (rho V)_g/
    (rho V)_c)]. Slot correlation Eq. 2 = Hatch-Papell Eq. 12 + ln cos(0.8 i_eff). Holes: effective slot height
    S'' = A_c/y (total hole area over the first row''s width; 0.403 in. four rows, 0.223 in. two rows, Eq. 3,
    "strictly empirical") and Eq. 4 adds -0.08 V_g/V_c for V_g > V_c. Table I(a) slots, I(b) holes PRINTED
    (faint scan). Fig. 8: an optimum coolant flow for angled slots (eta max 0.83 for the 60 deg slot at x =
    6.5 in.) -- more coolant lifts off and lowers eta.'
  status: screened
  verdict: 'Screened 2026-11-02. Extends Hatch-Papell to angled slots and normal-hole rows with empirical
    corrections fitted on its own data (no other lab). No gap plugged: combaero''s slot film is tangential, and
    its hole films are Baldauf/Colban (inclined holes at turbine-like geometry); normal holes at 1/4 in. on 1/2
    in. pitch in a 1500 R duct are an old, coarse configuration. The printed Table I is a possible cross-source
    set for a normal-injection effusion row at high V_g/V_c, after rebuilding S'' -- not planned. Not
    implemented.'
