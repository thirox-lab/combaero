  id: NASA CR-72374 (NREC 1111-1), NTRS 19680008088
  topic: [combustion, orifice, channel, jet_mixing]
  content: 'Scan with an OCR layer, 246 PDF pp. (PDF page = printed page + 10); OCR usable for prose, read
    equations from the images. A 1-D annular (and rectangular) combustor program: diffuser, air-flow and
    heat-transfer subprograms. AIR FLOW (printed pp. 70-103): marches station to station, hole flow first,
    then annulus and flame tube. Hole flow Eq. 75 m_h = Cd A_h (2 g rho_an (P_an - p_ft))^0.5 from annulus
    TOTAL to flame-tube static (the TN 3663 Phi convention); Cd from a LIBRARY of 100 measured hole types vs
    the loss factor (P_an - p_ft)/q_an (Eq. 76), stored pressure-ratio-corrected, Cd = Cd1 (0.75 + 0.25
    p_an/p_ft) (Eq. 77, after TN 3663); dome holes Cd 0.6; swirler loss Eq. 78 (K_sw 1.3, after Knight and
    Walker); secondary-hole recirculation Eq. 79 (after Rosenthal). ANNULUS (pp. 81-87): the hole flow leaves,
    the remaining flow takes a sudden-expansion total-pressure loss Eq. 88, P_an,1 - P_an,1'' = 1.85 q_an,1
    [m_h/(1.36 m_an,1)]^(1/(0.5 + 2.42 M^2.21)) (a fit to the RAeS sudden-expansion data sheet, Fig. 13 -- not
    bleed data), then momentum Eq. 91 with friction F = 0.0035 + 0.264 Re^-0.42 and a trapezoid area term,
    energy Eq. 92, solved as a quadratic in u_an,2 (Eqs. 95-96). JETS (pp. 87-98): initial jet angle phi from
    library data (47 hole types) or Eq. 97 sin^2 phi = Cd/Cd_inf (Cd_inf the Cd at infinite loss factor; "reasonable
    for round flush holes", unknown for scoops); penetration Eq. 98 y = 0.87 d_h (rho_an/rho_ft)^0.47
    (u_j/u_ft)^0.85 (x/d_h)^0.32 sin phi from 18 sources (refs 40-57, Fig. 14); Keffer-Baines centre-line
    decay Eq. 99 and profiles Eqs. 100-104; wall jets Eqs. 109-116; three entrainment models plus instantaneous
    mixing (Eqs. 117-122), each with a user constant C. FLAME TUBE (pp. 99-103): momentum Eq. 124 with
    entering and residual jets carrying the axial momentum m_j u_j cos phi_j, no friction; energy Eq. 125;
    quadratic in density Eq. 129. TEST CASES (pp. 130-151): air flow against Dittrich NACA RM E56I17 (ref.
    74) on a HYPOTHETICAL 12 in wide rectangular combustor with the NACA tubular rig''s areas (6.0 in liner,
    7.75 in casing, 52 in, 1.48 sq in holes, rows at 6-34 in, 80 F, 15 psia; table p. 138): Figs. 29-31 dP/q_ref
    vs M_ref, vs A_hT/A_ref and vs temperature ratio, each with the RM''s experimental curve REPRINTED as a
    faired line (no points) beside the NASA and NREC calculations; Fig. 32 airflow split, NREC vs Graves-
    Grobman, both calculated ("no experimental results are available"). Five overall test cases on a
    NASA-specified hypothetical annular combustor (Table II pp. 162-163: full wall coordinates, 19 hole rows
    with louvres, scooped 0.75 in holes and 2 x 1 in slots; 1150 F, 90 psia, 96 lb/s, f/a 0.018), results Table
    IV and Figs. 36-47 (Fig. 47 total/static pressure profiles, Case 3), all calculated. Heat-transfer test
    against Milford and Spiers (Figs. 33-35, missing geometry assumed). No measurement uncertainty anywhere.'
  status: screened
  verdict: 'Screened 2026-11-07 for #793/#813/#807. A METHOD and CODE reference, not data: every combustor
    result is calculated, and the only measured combustor data (Figs. 29-31) are faired curves reprinted from
    Dittrich RM E56I17 and compared on a different (rectangular) geometry, so they score nothing here --
    the primary is now held (dittrich_1957_NACA_RM_E56I17_..., screened 2026-11-07). NO buildable measured worked example. Code-to-code only: overall Test Case 3
    (Table II geometry, Table III options, Vol. 2 App. III station output) is fully specified but depends on
    library Cd for scoops/louvres and on the streamtube diffuser, so a combaero match would be model vs
    model and is not worth building before a measured case. What it gives combaero: (1) ANNULUS BLEED:
    Eq. 88 + momentum at M -> 0 is EXACTLY CrossflowSegmentElement''s station with kappa = 1 (1.85/1.36^2
    = 1.000: a total-pressure loss q (m_h/m_an)^2 on the remaining flow, static rise 2 q x (1 - x)), against the
    shipped Bassett kappa 0.75; its Mach dependence is a sudden-expansion fit, not bleed data, so it does
    not plug the bleed gap. (2) #813 JET ANGLE: Eq. 97 sin^2 phi = Cd/Cd_inf is a closure combaero lacks
    (it has a fixed injection_angle_deg and the "jets keep V_A" idea); uncited here, it is Lefebvre & Ballal
    Eq. 4.17 (credited there to Fletcher & Bastress, NREC Report 1082, 1964, and plotted with Cd_inf 0.625
    against Kaddah''s phi in their Fig. 4.5) -- a candidate to score on Kaddah''s measured phi (#1014) beside
    Report 1373 Eq. 9, and the flame-tube momentum
    Eq. 124 (m_j u_j cos phi) is the same form as combaero''s injection_momentum hook. (3) Cd convention:
    Eqs. 75-77 confirm the TN 3663 Phi/total-pressure convention and the 0.75 + 0.25 p_an/p_ft correction the
    registered TN 3663 entry describes -- no new Cd closure. (4) Penetration Eq. 98 and the mixing models are
    jet_mixing method, not network; nothing to adopt for the flow split.'
