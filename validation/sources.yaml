- file: sources/heat_transfer/turbulence/Lang_2023_RWTH_diss_turbulent_decay_compressor_cascade.pdf
  sha256: '707691669d26018da0ed26e671fcecfe5b19d128aef49d8e2bec32fe6d6530fb'
  citation: Lang, H. M. (2023). Einfluss der turbulenten Abklingrate auf die Umstroemung eines Verdichtergitters
    (Impact of the turbulent decay on a compressor cascade flow). Dr.-Ing. dissertation, RWTH Aachen University.
  topic: [other]
  content: 'German, 262 pp. Linear HP-compressor cascade (M 0.56, Re 790,000) at two turbulent decay rates
    (grids TG2/TG3); transition, wake, k-omega / gamma-Re_theta assessment. Of use here: Sec. 3.1.1-3.1.2 (pp.
    45-48) reviews grid-turbulence decay -- Roach Tu = 1.13 (x/d)^(-5/7) for square-mesh square-bar grids,
    porosity > 0.5; Batchelor / Laws-Livesey Eq. 3.2 Tu^2 = (xi_s/C3) ((x - x0)/m)^-1 with C3 ~ 100 for square
    meshes, x0 ~ 10 m (the LOSS-based Tu closure); grid loss vs porosity (Pinker-Herbert, Idelchik) and its
    rise with Mach from M ~ 0.3. Table 6.2 (p. 125) scores both on the author''s measured grid TG2: Roach -17%
    to +153%, Laws +10% to +382%, depending on which loss correlation (xi_s Roach 5.49 vs Idelchik 7.96) and which
    nozzle-contraction correction (Dunham, Rannacher, none) is used. Sec. 6.2.3 (pp. 134-141): a Roach variant
    for inclined grids (Eq. 6.27: Roach with the bar width projected to d cos(Theta) and a factor 0.93; the
    thesis quotes C1'' = 0.72 at Theta = 58 deg, which Eq. 6.27 as printed does not reproduce -- 0.67 -- so
    check before use) and measured loss-vs-Mach maps of grids to M ~ 0.6 (Figs. 6.13a, 6.15; Tables 6.3-6.4 geometry).'
  status: screened
  verdict: 'Screened 2026-10-28 for #763 (a Tu-from-loss closure for the slot-film C_m(Tu)). Plugs part of the
    gap the Roach / Laws-Livesey wanted entries name: it states the loss-based relation Tu^2 = (xi_s/C3)(x/m)^-1
    with C3 ~ 100 (secondary, citing Laws & Livesey 1978) and, more usefully, MEASURES how badly it can miss
    (Table 6.2: +10% to +382% from the choice of loss correlation and contraction correction alone) -- a
    warning that a Tu-from-loss closure is only as good as its loss coefficient. Not a scoring set for D-7958''s
    blockage plates (grids, porosity > 0.5, no film). Everything else (cascade aero, transition) is outside
    combaero. Secondary for the correlations; the primaries stay wanted.'
