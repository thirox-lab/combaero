  citation: Graves, C. C., Grobman, J. S. (1958). Theoretical analysis of total-pressure loss and airflow distribution
    for tubular turbojet combustors with constant annulus and liner cross-sectional areas. NACA Report 1373.
  id: NACA Report 1373 (supersedes RM E56I04)
  topic: [combustion, orifice, channel]
  content: 'Theory only, 26 pp. (printed pp. 899-924), two-column scan. 1-D incompressible (App. B) and
    compressible cold-flow (App. C, M_r up to 0.15) model of a parallel-wall tubular combustor: annulus with
    friction (f_A 0.005, l/D 4), flush liner holes as a continuous slot with the Dittrich-Graves Cd (Fig. 3,
    3/4 in hole in 0.040 in wall: C_p vs (P_A - p_j)/(P_A - p_A), C/C_p vs p_A/p_j; Eq. 17 C = 0.827 sin
    theta - 0.232), instantaneous jet mixing, jets keep the annulus axial velocity, heat release through T_L/T_1
    from fuel-air ratio (Fig. 2, n-octane). Generalised calculated curves: dP/q_r vs A_h,T/A_r for A_L/A_r
    0.4-0.75, T ratio 1-4, dome flow 0-0.1, M_r 0-0.15 (Figs. 6-15); w_L/w_T vs A_h/A_h,T (Figs. 16-23); one
    worked pressure profile along the combustor (Fig. 5: A_L/A_r 0.6, A_h,T/A_r 1.09, V_r 100 ft/s, P_1 30 in
    Hg, T ratio 1 and 3).'
