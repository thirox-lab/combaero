- file: sources/orifices/rogers_hersh_1976_NASA_CR-2681_grazing_flow_orifice_resistance.pdf
  sha256: '34ce33b9882f01a5323669848b241fd09ca53becbfe999d5e258f94cfd1ec9b0'
  citation: 'Rogers, T., Hersh, A. S. (1976). Effect of grazing flow on steady-state resistance of isolated
