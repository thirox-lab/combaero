- file: sources/heat_transfer/film/Hassan_2013_PhD_Concordia_micro_tangential_jet_film.pdf
  sha256: '94471265a390605f492ae76150b546d1a88eb94ad1b8059aa2b5d77a6735da6a'
  citation: Hassan, O. (2013). Thermal and flow field investigations of a micro-tangential-jet film cooling
    scheme on gas turbine components. PhD thesis, Concordia University, Montreal (June 2013).
  topic: [film]
  content: 'Born-digital, 218 pp. A micro-tangential-jet (MTJ) shaped film scheme (35 deg inclination, lateral
    expansion, near-tangential exit; Fig. 6.1) on a vane (pressure and suction sides, linear cascade after
    Chappell et al. 2010) and on a flat plate; transient TLC eta and HTC, 2-D/3-D PIV. Main finding: no
    significant HTC augmentation for BR < 1; the MTJ film behaves 2-D, slot-like. Flat-plate rig: 99 x 54 mm
    duct, 550 mm long, schemes 200 mm from the inlet, Tu 8-8.5% (grid), DR close to unity, Br based on the
    scheme BASE (metering) area in the validation (Brb). Appendix A TABULATES (pp. 163-165, read from the text
    layer, which is clean): Table A.1 centreline and laterally averaged eta behind one row of CYLINDRICAL holes
