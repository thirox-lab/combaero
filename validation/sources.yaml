  - film
  content: 'Open access (CC BY), 15 pp. Florence single-sector planar non-reacting rig, ambient, one radial
    swirler, swirler dp/P 3.5 %, Re_main 515000, M 0.22. Effusion plate on the BOTTOM WALL (liner) downstream
    of the dome; the swirl jet impinges ahead of row 1 at x/Dref 0.3. Two plates, 55 holes, 10 staggered rows:
