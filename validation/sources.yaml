- file: sources/combustor_network/dittrich_1957_NACA_RM_E56I17_parallel_walled_combustor_loss.pdf
  sha256: '25092921a2345200c6b37997bb3bc97e6985c111703fabe9101b7c83042fe6c7'
  citation: Dittrich, R. T. (1957). Comparison of experimental with theoretical total-pressure loss in
    parallel-walled turbojet combustors. NACA RM E56I17, Lewis Flight Propulsion Laboratory, January 9, 1957.
  id: NACA RM E56I17, NTRS 19930089548
  topic: [combustion, orifice, channel]
  content: 'Scan with a poor OCR layer, 31 PDF pp. (PDF page = printed page + 1); read numbers from the
    images. Rig (p. 3, Figs. 1-2, PDF 4/12-13): parallel-walled tubular combustor, liner 6.005 in OD, 0.031 in
    wall, streamlined dome with NO dome holes, eight rings of six 1.375 in holes (t/d 0.023), rings 4 in apart,
    the first about 2 in downstream of annulus-entry station 2 (Fig. 2, a dimensioned sketch, not a table);
    liner and outer shell 35 in long; three outer shells 8.48/7.74/7.14 in (A_L/A_r 0.502/0.602/0.708); open
    hole area varied by TAPING rings: 8/6/3/2 rings open, A_h,t 0.495/0.371/0.186/0.124 sq ft, A_h,t/A_r 0.32-1.78
    -- 12 configurations, table p. 3, which rings are open shown by the inset sketch on each Fig. 4 panel. The
    liner discharges into an 8.0 in pipe; outlet rake (station 3) 20 in downstream; inlet rake at station 1 in
    an 8.0 in pipe, corrected to station 2 by the measured shell-dependent loss of Fig. 3. Air about 75 F,
    nominal 4 lb/s (2 and 6 lb/s on some configurations), P 850-5600 psf, M_r about 0.03-0.21, Re_r 3e5-1e6.
    MEASURED: cold-flow total-pressure-loss coefficient dP/q_r (station 2 to 3, q_r on the outer-shell area and
    station-2 density) vs M_r, Fig. 4(a)-(l) (PDF 15-26), about 6-15 cleanly sampled points per panel, each
    with the Graves-Grobman (RM E56I04 = Report 1373) calculated curves with and without annulus friction; Fig.
    4(h) also three hole DISTRIBUTIONS at the same A_h,t/A_r 0.38 (two rings open upstream, downstream, or split;
    downstream about 10% higher loss); Fig. 5 cross-plots at M_r 0.05 and 0.15; hot flow (propane, To/Ti 1-3,
    A_L/A_r 0.602, A_h,t/A_r 1.14) Fig. 6 with flame-ejection points flagged; Fig. 7 a reprinted CALCULATED
    pressure profile (Report 1373), "confirmed by unpublished data" not shown. NO airflow split, NO static
    pressures, NO hole flows measured. No measurement uncertainty stated ("within experimental error").'
  status: screened
  verdict: 'Screened 2026-11-07 (was wanted, found via NREC 1968 ref. 74). LOSS case MOSTLY READY; flow-split
    case NOT BUILDABLE (nothing measured inside the liner or annulus). It is the MEASURED counterpart of Report
    1373 (constant annulus and liner areas, no dome flow -- exactly Report 1373''s model), where Grobman 1959
    (held) is the tapered counterpart and the only one with a (Cd-derived) row split. Geometry is complete for
    a combaero annulus + liner network: shell and liner diameters, wall thickness, hole size and count per
    ring, ring pitch, which rings are open per panel; two items need a stated assumption -- the first-ring
    position (about 2 in, read from the Fig. 2 sketch) and the outlet: dP/q_r runs to station 3, so the liner
    exit dump into the 8.0 in pipe and 20 in of mixing are inside the measured loss and must be modelled
    (a sudden expansion A_L -> pipe), as Report 1373 does. Best panels: Fig. 4(a)/(e)/(i) (8 rings, three
    airflows, about 15 points each), then the A_h,t/A_r sweep 4(a)-(d) and the A_L/A_r sweep (a)/(e)/(i), and
    4(h) for hole distribution. Labels: ACCURACY (cross-source) for combaero''s closures -- McGreehan-Schotsch
    hole Cd under annulus crossflow, kappa stations, momentum chambers; the liner hole Cd is TN 3663''s thin-hole
    regime (t/d 0.023), same lab, so a run with a TN 3663 Cd is still cross-study. Reproducing the dashed
    Graves-Grobman curves is model-vs-model only. Within NACA the authors find the theory with annulus friction
    up to 17% HIGH (p. 5); combaero landing between the two calculated curves would be unremarkable, the
    measured curve is the target. Hot data (Fig. 6) is one configuration with flame ejection at low M_r: only the
    points above M_r 0.06 are a heat-addition loss case, and the heat release is not resolved axially.'
  read_for: ['#793 measured full-combustor total-pressure loss and liner airflow split with full geometry',
    measured counterpart of Report 1373 (constant areas)]
  issues: [793]
  records: []
  notes: 'Public NACA RM, fetched 2026-11-07 from NTRS 19930089548. Cites Graves-Grobman as RM E56I04 (1956),
    held. NREC 1968 Figs. 29-31 reprint its faired curves on a different geometry. Digitising targets if scored:
    Fig. 4(a)/(e)/(i) first; render at 200 dpi or more.'
