- file: sources/radiation/Fu_et_al_2026_ATE_307_133288_ammonia_flame_radiation_review.pdf
  sha256: '1300aa35d62276003aa0c258c431bae9b7dcdf88eb43bb4af851576cc6a1058f'
  citation: 'Fu, Z., Davies, J., Mashruk, S., Alnajideen, M., Xiao, H., Valera-Medina, A. (2026). Combustion
    radiation in ammonia-based fuels: progress and challenges. Applied Thermal Engineering 307, 133288.'
  id: doi:10.1016/j.applthermaleng.2026.133288
  topic: [radiation, combustion, review]
  content: 'Open access (CC BY 4.0), 22 pp. Review of radiation from NH3, NH3/H2, cracked NH3, NH3/hydrocarbon and
    NH3/solid-fuel flames: pure NH3 and NH3/H2 flames radiate mainly from H2O (no CO2, no soot), with minor NH3
    and NO bands; hydrocarbon blending restores CO2 and possibly soot. Tables 1-6 compare fuel properties,
    literature coverage, measured radiative heat-flux trends and model applicability (optically thin, WSGG, SNB,
    FSCK, LBL). States that conventional WSGG fits are made for H2O/CO2 mixtures and may be unreliable for
    NH3-rich flames, and that elevated-pressure radiation data for ammonia are scarce. Mostly furnace and
    burner scale at about 1 atm.'
  status: screened
  verdict: 'Screened 2026-11-02. Background for the carbon-free limit of a combaero emissivity kernel: combaero''s
    species set includes NH3 and H2, and their products have Mr = H2O/CO2 -> infinity, outside Bordbar 2014/2021
    (Mr 0.1-4). A kernel must therefore either cap Mr with a stated refusal or carry a pure-H2O set (Alberti et al.
    handle single gases; Bordbar-type pure-H2O WSGG sets exist but are not held). No closure or validation case
    here (no gas-turbine-pressure data). Not checked: the individual cited heat-flux studies.'
