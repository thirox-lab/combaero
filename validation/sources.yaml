    Math missing from the text layer, readable on the page): Odgers eta_PZ,max = 0.72 + 0.29 tanh[1.5475e-3 (Ta +
    108 ln Pa - 1863)] and eta_SZ,max with 0.80 (Eqs. 1-2); Lefebvre R1 = 0.5 sigma (1 + eps_w) eps_g Tg^1.5 (Tg^2.5
    - Tw^2.5), C1 = 0.020 k_g/D_L^0.2 (m/(A_L mu_g))^0.8 (Tg - Tw), R2 = sigma eps_w eps_c/(eps_c + eps_w (1 -
    eps_c)(A_w/A_c)) (Tw^4 - T3^4), C2 = 0.020 k_a/D_an^0.2 (m/(A_an mu_a))^0.8 (Tw - T3) (Eqs. 3-6), eps_g = 1 -
    exp(-290 P L (q l_b)^0.5 Tg^-1.5) (Eq. 7); thin uncoated wall (Tw1 = Tw2, no conduction term). Fig. 7 PLOTS the
