  sha256: '2990d1ce5050957f0cd875d72065c7f220ea3f1b6dfa27211e1a1e3a1460eee3'
  citation: 'Northern Research and Engineering Corporation (1968). Computer program for the analysis of annular
    combustors. Volume I: Calculation procedures. NREC Report 1111-1, NASA CR-72374, Contract NAS3-9402,
    January 29, 1968 (directed by D. M. Dix; Bewsher, Croissant, Hoggett, Monahan, Brassert, Duffield;
