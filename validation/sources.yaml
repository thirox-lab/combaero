- file: sources/combustor_network/varol2015_reverse_flow_combustor_network_rev2.pdf
  sha256: 'e7b74917e7a7958cd529112da2705172819e5514c3f979f735839695fb53f2ab'
  citation: 'Varol, G., Sarikaya, G., Tuncer, O. (2015). One dimensional network model for a reverse flow
    combustor. AIAA paper, Istanbul Technical University (venue and number not printed; filename suggests
    the 2015 AIAA Joint Propulsion Conference).'
  topic: [combustion, orifice, film]
  content: 'Reverse-flow annular combustor for a 1000 hp turboshaft, 1/13 sector, 14 pp. Table 1 idle/cruise/
    take-off conditions; Table 3 hole sets (positions, counts, diameters: 3 machined-ring film sets and 2
    plain-hole sets per liner); Table 4 per-set mass flow and fraction from isothermal CFD and from the 1-D code;
    Table 5 CFD and 1-D Cd. Approach: node/element network after Stuttaford-Rubini and Gouws (Fig. 4, both
    liners of the sector as two parallel regions, mass-weighted), continuity at nodes (Eq. 1) and a dP = s H g f
    flow law per element (Eq. 2); elements DC (duct with area change, annulus and flame tube), RL (restrictor
    with loss coefficient), RD (restrictor with Cd); solved by the Greyvanstein-Laurie segregated pressure
    correction (P = P* + P'', Q = Q* + Q'', rho = rho* + rho'', Eq. 3), incompressible hole law Eq. 4 m = Cd A (2
    rho (P1 - pj))^0.5. Hole Cd after Norster (NREC 1980 design manual, ref. 9): Eq. 6 plain Cd = 1.25 (K -
    1)/[4K^2 - K(2 - alpha)^2]^0.5, Eq. 7 plunged 1.65 (same denominator), Eq. 8 K = 1 + 0.64 [2 phi^2 + (phi^4
    + 1.56 phi^2 (4 alpha - alpha^2))^0.5] with alpha = m_h/m_an, phi = alpha/A_r, A_r = A_h/A_an (Eqs. 9-11),
    iterated on the hole flows (p. 6); jet angle Eqs. 12/13 sin theta = (K - 1)/(1.6 Cd K) plain, /(1.2 Cd K)
    plunged. Machined-ring film holes use fixed Cd 0.600 (Table 5). Odgers zone efficiency, Lefebvre
    radiation, Rizk convection, Ballal-Lefebvre slot film (Eq. 31); liner temperatures plotted only (Fig. 11).
    No measured data.'
  status: screened
  verdict: 'The simplest #793 example found, rated "mostly ready": checked 2026-10-27 that Table 4 is a
    single-plenum parallel-orifice split -- with cruise inlet density (763 kPa, 564 K) every hole set''s CFD flow
    and Cd give the same dp, 33.4-34.0 kPa (4.4% of P3), and the 1-D column is reproduced to 0.5% by m_i
    proportional to Cd_i A_i with the code''s Cd 0.600/0.625. Needs one assumption: the swirler area is not
    printed (back it out as 116.5 mm2 from its CFD Cd and flow). Reference values are CFD and the authors'' own
    1-D code, not measurement; matching the CFD column with the CFD Cd is near-tautological, so the example
    demonstrates a flow split, not a Cd model. The heat-transfer half is not reproducible (no liner geometry).
    APPROACH (re-screened 2026-11-07, "possibly useful, just for approach"): nothing to adopt -- an
    incompressible node/element network with a segregated pressure-correction loop and Cd iterated by
    successive substitution; combaero already solves the same topology compressibly with Newton and analytic
    Jacobians. Eqs. 6/7 are Lefebvre & Ballal Eqs. 4.15/4.16 (Kaddah plain, Freeman plunged; the Kaddah primary
    is held), but with K computed from the bleed ratio by Eq. 8 (NREC 1980) where the book''s K is the jet to
    annulus dynamic-pressure ratio. Two pointers only: Eqs. 12/13 are a K-based jet-angle closure for #813 beside
    NREC 1968 Eq. 97 (= Lefebvre & Ballal Eq. 4.17) and Report 1373 Eq. 9, all scoreable on Kaddah''s measured
    phi (#1014); and Eq. 7 (plunged, 1.65) is the plunged-hole Cd combaero lacks, whose measured primaries
    (Freeman 1965, Venneman, Marshall) are not held.'
