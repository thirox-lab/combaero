    ~78 mm, inner liner ~28 mm, outer casing ~74 to ~69 mm, inner casing ~14 mm stepping to ~25/20 mm at x ~70-80
    mm; holes only in a CAD sketch (no sizes, counts or positions). Plain holes, no film slots ("future study").
    Fuel not named (kerosene look-up tables, air-blast atomiser); fuel flow and FAR not printed; luminosity factor
    L and the near-wall radial temperature factor (from Topal 2013) not given. Fig. 9: mean gas T to ~1650 K,
    near-wall to ~1950 K. Fig. 12 (absolute K, not normalised): ~15 paint points (about 600 K at x 3 mm rising to
    969 K at 60 mm, 770 K at 83 mm) and 3 thermocouples (~810, ~915, ~860 K at x ~32, 48, 67 mm). The paint''s
    first colour change is 490 C (763 K), so the paint points below it are not threshold readings. Thermocouple and
