    K over 0-200 h at ~1100-1300 C) and the direction (sintering raises k, delamination lowers it). Not a
    replacement for the uncited fit; Zhu & Miller''s later EB-PVD 7YSZ study (2003 Cocoa Beach, "thermal
    conductivity and temperature limits", NTRS 20050212118) gives k vs temperature and time per its abstract
