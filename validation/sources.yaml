    gas_augmentation behind a row). Fidelity would be judged on its own Figs. 8.25-8.30 (digitising needed;
    Fig. 8.29 is heavily overplotted near x/D < 10, so fidelity there is an upper bound). Cross-source
    accuracy: Eriksen 1971 Table II (held, tabulated) -- BUT Fig. 8.29 plots Eriksen & Goldstein 1974 (ref.
    22) and Goldstein & Yoshida (ref. 25) beside Ammari''s points, and whether they shaped the dotted mean
    curve is not stated; treat Eriksen as possibly in-sample for the 35 deg fit. Limits: one row, P/D 3,
    Tu 0.68 % (low), mass-transfer analogue, flat plate; effusion plates (P/D 5-8, many rows) are outside.'
