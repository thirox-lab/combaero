  id: AFWAL-TR-84-2104 (DTIC AD-A151464)
  topic: [combustion, radiation]
  content: 'Public, 156 pp., poor scan (equations and figures read from page images; PDF page = printed page + 11
    around Section VI). A re-analysis of six USAF engine fuel-effects programs (refs 1-6) for J79-17A, J79-17C,
    F101, TF41, TF39, J85, TF33 and F100. Table 1 (p.4, TABULATED): 13 fuels, H 12.0-14.5 mass %, LHV and
    properties. Section VI liner wall temperature: R1 Eq. 19 (as shipped); eps_g Eq. 21 (P in kPa); L =
    336/(percent H)^2 Eq. 22 QUOTED from ref. 7 (AFWAL-TR-83-2004), with no fit, scatter or fitted quantity
    printed; R2 = 0.4 sigma (Tw^4 - T3^4) Eq. 23; C1/C2 0.017/0.020 Re^0.8; no film term; combined Eq. 26 with
    97440 = 290 x 336. Figs. 38-41 (PLOTTED only): liner wall T against fuel H at idle/cruise/take-off/dash for
    J79-17A, J79-17C, F101 and TF41, measured against CALCULATED UNCOOLED Tw. F101 (Fig. 40) by eye: dash about
    1300 K, take-off 1285-1295 K, cruise 1000-1015 K, idle 640-700 K, cluster spread about 60 K, faired lines
    flat or slightly rising with H. F101 envelope P3 386-1266 kPa, T3 464-850 K, m_A 8.5-20.5 kg/s; a 54 deg
    sector rig. Other engine-fitted closures (per-engine constants; geometry not tabulated): combustion
    efficiency Eqs. 8-9; LBO Eq. 15 with Table 2 constants (TABULATED); NOx Eq. 27; CO Eq. 28; UHC Eq. 29; soot
    Eq. 34 with Table 3 C3/C4 (TABULATED) and the smoke-number conversion (TABULATED); pattern factor Eqs.
    36-37. No liner geometry, air split, cooling geometry, per-point conditions, radiation or emissivity data,
    or measurement uncertainty.'
  status: screened
  verdict: 'Screened 2026-11-03 (was wanted). It does NOT contain the data or fit behind L = 336/H^2: Eq. 22 is
    quoted from ref. 7 (AFWAL-TR-83-2004, now wanted), fitted over refs 1-6 (H 12.0-14.5 %, P3 about
    250-1870 kPa, T3 413-850 K; on that range L = 1.60-2.33, and L = 1 only at H = 18.3 %, so gas fuels are an
    extrapolation). No pressure-dependent L; p.128 only says pressure acts through soot concentration. F101
    (Fig. 40, the likely source of L&B Fig. 8.5) is NOT a combaero case. It is not fidelity, because its
    calculated lines are uncooled; and it is not accuracy, because it lacks geometry, air split, cooling and
    per-point conditions, and is overplotted. Its measured Tw against H is flat to slightly rising, opposite to
    the radiation model and to the report''s own Conclusion 4 (Section IX.4 calls the chemical effect small).
    Use: confirms the shipped R1 and Eq. 26 constants; tabulated fuel properties; leads to the primaries (ref. 7
    for L, ref. 2 Gleason et al. 1979 AFAPL-TR-79-2018 for F101; both wanted).'
  read_for: ['#793 origin, data and range of L = 336/H^2', '#793 F101 liner wall temperature as a liner case (not buildable)', '#793 pressure dependence of L (none offered)']
