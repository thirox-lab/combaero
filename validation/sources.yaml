  id: Ammari 1989 PhD (Nottingham)
  topic: [film]
  content: 'Scan with a text layer, 260 pp. (prose OCR usable, equations and figures from the page images).
    Laterally averaged and local film heat transfer coefficient ratio h/h0 behind ONE ROW of round holes, P/D
    3, injection 35 deg and 90 deg, flat plate, by mass transfer (swollen-polymer surface + holographic
    interferometry, isothermal-wall analogue). M 0.5-2.0; density ratio 1.0 and 1.52 (foreign-gas injection);
    acceleration parameter K = 0, 1.9e-6 and 5.0e-6 (35 deg only); Re_D 3.8e3, Tu 0.68 %, delta*/D 0.40,
    u_inf 25 m/s (Table 6.2 lists the 7 test series). Section 8.5 correlations: 90 deg h/h0 = 1.0 + 0.555
    exp[-0.14 (x/D) M^-0.5] (M 0.5-1.5, both DR, x/D < 25, +-5 %, Fig. 8.27); 35 deg h/h0 = 1.025 + 0.35
    exp[-0.15 (x/D)(u_c/u_inf)^-4/3] (Forth & Jones scaling, +-7 % excluding u_c/u_inf = 2, Fig. 8.30);
    with acceleration a factor [1 - 0.04 (K x 1e6)] (Fig. 8.32, large scatter). Data are FIGURES ONLY (Ch. 8;
    no data tables). Ch. 9: PHOENICS CFD (not useful). Appendix D uncertainty.'
  status: screened
  verdict: 'Screened 2026-11-06. PLUGS A GAP: combaero has no film-side h for discrete-hole films --
    FilmCoolingElement changes only T_aw and the wall keeps the duct h (the slot film got Seban 1960 in #962),
