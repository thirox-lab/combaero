- file: sources/orifices/stolz_1988_NSFMW_paper_3.1_first_revision_of_ISO_5167.pdf
  sha256: '8969c9cbab0587024a2743ae557cb4c4d3af49268e65ad29f6ed2a9bc90f2b9f'
  citation: Stolz, J. (1988). The first revision of ISO 5167. North Sea Flow Measurement Workshop 1988, 18-20
    October 1988, National Engineering Laboratory, East Kilbride, Glasgow, Paper 3.1.
  id: NSFMW 1988 paper 3.1 (NFOGM archive item 1988-10)
  topic: [orifice]
  content: '7 pp. (4 of text), scanned with a poor OCR layer; read from page images. Lists "without comments"
    the technical changes ISO/TC30/SC2 decided for the revision of ISO 5167:1980 (published as ISO 5167-1:1991),
    clause by clause of the 1980 text. Orifice plates: beta range 0.20-0.75 for all three tappings (7.1.7.1);
    tap diameter max 0.13 D or 13 mm (was 0.08 D or 12 mm); flange-tap position 25.4 +- 0.5 mm when beta > 0.6
    and D < 150 mm, else +- 1 mm; plate thickness 3.2 mm allowed above 0.05 D; bevel 45 +- 15 deg; eccentricity
    limit 0.0025 D/(0.1 + 2.3 beta^4) (was 0.0005). 7.3.1 LIMITS OF USE, now common to all tappings except Re_D,
    d and D in mm: "d <= 12.5" (printed so; almost certainly d >= 12.5, as in later editions), 50 <= D <= 1000,
    0.20 <= beta <= 0.75; corner taps Re_D >= 5000 for beta <= 0.45 and Re_D >= 10 000 for beta > 0.45;
    flange and D-D/2 taps Re_D >= 1260 beta^2 D; the upper Re_D limit deleted; pipe roughness criteria k/D
    unified (most severe kept; k table moved to an annex). 7.4: pressure loss between ~1D upstream and 6D
    downstream, with a simpler alternative dw/dp = 1 - beta^1.9 (orifice plates). C tables gain Re_D = 1e8 and
    infinity columns; new annex on iterative computation. The C equation itself is NOT printed, and the 1980
    limits are given only where a change is stated (old values for tap diameter, eccentricity, inspection D).'
  status: screened
  verdict: 'Screened 2026-11-02 for #876/#873. Gives the Stolz equation''s limits of use as revised for ISO
    5167-1:1991 (above) -- the revised standard, not the 1980 edition the shipped Cd_Stolz is labelled with
    (orifice.h: "ISO 5167:1980"; Reader-Harris 2022 calls the 1991 change to the equation minor). So it can
    source a Stolz lower Re_D hold and metering_cd_in_range limits for an ISO 5167-1:1991 Stolz, but the
    ISO 5167:1980 limits (separate per tapping, with an upper Re_D limit) remain unsourced. Moot for the code
    path: Stolz was deprecated in 0.8.0 and removed in 0.9.0 (#876), so no hold was implemented. The 1 - beta^1.9 loss is an older, simpler
    form than the ISO 5167-2:2003 Eq. (7) combaero ships (not compared). Not implemented.'
  read_for: ['#876 Stolz limits of use', '#873 Stolz low-Re hold']
  issues: [873, 876]
  records: []
  notes: Fetched 2026-11-02 from the NFOGM North Sea Flow Measurement Workshop archive (nfogm.no, 1988 item 10,
    free). The same archive holds Reader-Harris 1988 "A new type of formula for the orifice plate discharge
    coefficient" (item 11) and Hobbs, "The NEL orifice plate project" (item 16), not fetched.

- file: sources/orifices/jobson_1955_PIMechE_169_767_compressible_orifice.pdf
  sha256: 'f227c5da0afadc1d30a5677aa13c30500c9aece91586bb7c937ab74082cbf1dd'
  citation: Jobson, D. A. (1955). On the flow of a compressible fluid through orifices. Proc. Instn Mech. Engrs
    169, 767-776. doi:10.1243/PIME_PROC_1955_169_077_02
  topic: [orifice]
  content: 'Theory of the compressible contraction coefficient of a sharp-edged orifice from a reservoir: force
    defect f = 1/Ci - 1/(2 Ci^2) from the incompressible Ci (Eq. 5), subcritical C(r) (Eq. 11), choked C(r)
    (Eq. 15) to any back pressure, Borda limits (Eqs. 16/17), m = Cv C K_N A sqrt(p0 rho0). Table 2: C vs r for
    a plane slit (Ci = pi/(pi+2)) against Howarth''s hodograph (Table 1); Fig. 5: Perry 1949 (air) and Schiller
    1933 (steam) mass-flow coefficients vs pressure ratio. p. 772 suggests Ci <= 0.7 as the theory''s upper
    limit; Bosanquet''s discussion (p. 773) shows C dipping to 0.852 at f = 0.5 (the nozzle limit).'
  status: implemented
  verdict: 'Implemented (#854) as OrificeElement compressible_model "jobson1955", analytic (f, J),
    with an approach-velocity extension not in the paper: f(Ci, beta, Cv) = 1/Ci - 1/(2 Ci^2) - Cv beta^2 + Cv^2
    beta^4/2, fixed by the incompressible limit. Fidelity: Table 2 reproduced within 0.001 at every printed r
    (tests/test_orifice_jobson.cpp). Cross-source accuracy (Jobson fitted nothing to Perry; Cd 0.600 = slit Ci x
    Cv 0.982): on Perry 1949 air, Fig. 5a digitised and user-confirmed 2026-10-29, N = 15, bias -1.4%, RMS 1.6%,
    worst -2.5%; the isentropic nozzle (the pre-0.8 default) at the same Cd scores RMS 20.5% (flat below r_c). The beta
    extension lies inside ISO 5167-2 Eq. (5)''s stated uncertainty over beta 0.2-0.75, p2/p1 0.75-0.98 with RHG
    C (cross-source). Fig. 5b (Schiller 1933 superheated steam, n = 1.3) digitised and user-confirmed 2026-10-30
    (#861), cross-source: N = 9, bias +1.1%, RMS 1.9%, worst +5.1% (r = 0.89, steep slope); nozzle RMS 19.8%.
    Since 0.8.0 (#861) the build-time default for an incompressible-referenced Cd (RHG, Idelchik, Lichtarowicz,
    McGreehan-Schotsch baseline) on a sharp-edged bore at beta <= 0.75; the nozzle stays for fixed Cd, Stolz and
    the McGreehan-Schotsch crossflow term. The paper is reservoir-fed (no inner solve); the beta extension''s
    jobson_expansibility has a unique root at every r in (0, 1] (#957, 33000-point sweep): its old fixed point
    cycled where the flux slope at the root is below -1 (beta 0.5-0.9, Ci 0.6-1, all outside Ci <= 0.7, beta
    <= 0.75), now a bracketed Newton. At high beta Ci and higher r the momentum quadratic has no real root and
    the closure holds its discriminant at zero (degenerate, in_range false), unchanged.'
  read_for: ['#854 compressible orifice expansion', '#957 expansibility r range']
  issues: [854, 861, 957]
  records: [validation/cooling/data/jobson1955/metadata.yaml, validation/cooling/orifice_runner.py,
    tests/test_orifice_jobson.cpp, python/tests/test_orifice_jobson_854.py, python/tests/test_jobson1955_fig5.py,
    python/tests/test_orifice_default_model_861.py]
  code: [include/orifice_jobson.h, include/orifice.h, src/orifice.cpp, src/solver_interface.cpp,
