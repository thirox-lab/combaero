- file: sources/combustor_network/grobman_1959_NASA_Memo_11-26-58E.pdf
  sha256: 'dff48e6baee6b3a74a445212ebd930cdb4e058a28aa88875315d8a25d8844ad2'
  citation: Grobman, J. S. (1959). Comparison of calculated and experimental total-pressure loss and airflow
    distribution in tubular turbojet combustors with tapered liners. NASA Memo 11-26-58E, Lewis Research
    Center, January 1959.
  id: NASA Memo 11-26-58E (E-126)
  topic: [combustion, orifice, channel]
  content: 'Scanned, 50 PDF pp. (PDF page = printed page + 2); OCR unusable, read the images. Rig: 8.0 in ID
    housing, four tapered liners A-D (Table I, p. 18: L 12/12/12/24 in, L/D 1.5/1.5/1.5/3, alpha 14/7/3.5/3.5
    deg, A_L,2/A_r 0.06/0.40/0.67/0.40), each with 108 flush circular holes in 9 rows of 4, 6, ... 20 holes
    (rows at x/L = (1.5 + k)/12, k = 0..8, read from the sketches), hole d 1/2, 5/8, 3/4 in giving A_h,T/A_r
    0.422/0.659/0.950 -- 12 liners; 0.043 in Inconel wall; no dome flow. Isothermal air at about 300 K, 2 and
    4 lb/s, P1 10-60 in Hg, M_r 0.04-0.25; propane heat release on five liners, exit/inlet T 2-4. MEASURED:
    total-pressure loss dP/q_r from 20-tube rakes at B and C, all 12 liners vs M_r (Fig. 11(a)-(l), mostly
    cleanly sampled, two airflows), with heat release (Fig. 14, overplotted clusters); combustion efficiency
    (Fig. 15, 0.4-0.9). Model D only has liner and annulus static taps per row: its airflow split (Fig. 17,
    3/4 in holes, M_r 0.102, 2 lb/s, isothermal, 8 cleanly sampled points) is COMPUTED from the measured
    row static drops and the TN 3663 Cd, not metered. Also the Graves-Grobman method extended to tapered
    liners (App. B), with calculated curves (Figs. 7-10, 16) and the calculated value beside each experiment
    (Figs. 13, 14, 17). No measurement uncertainty is stated anywhere.'
  status: screened
  verdict: 'Screened 2026-10-27 for #793: the MEASURED full-combustor case the issue asked for, rated MOSTLY
    ready. Best case: model D, 3/4 in holes, isothermal -- geometry fully recoverable from Table I (every
    printed ratio reproduced from the sketch dimensions: A_h,T/A_r 0.949, A_L,2/A_r 0.392, alpha 3.56 deg),
    scored on dP/q_r vs M_r (Fig. 11(l)/13(d): about 4.75 at M_r -> 0, rising to 8.5 at 0.27; the method
    calculates 5.50, +16%) and on the row-by-row split (Fig. 17; measured lies 0.02-0.06 below the method''s
    curve over rows 1-5). Labels: the split and losses are ACCURACY (cross-source; no combaero closure is
    from this rig); reproducing the Graves-Grobman calculated curves is model-vs-model only, not fidelity.
    The split carries TN 3663''s Cd inside it, so scoring it mixes the network with the Cd question (TN 3663
    now registered: Eq. 17 reads 12-29% low at its Phi < 3). The fuel nozzle alone raises dP/q_r by about
    0.3, and heat-release runs had it in place.
    combaero pieces: annulus as CrossflowSegmentElement stations (Pt-conserving bleed is kappa of about 1;
    GG assume no annulus mixing loss), liner rows as duct-fed EffusionPlateElement panels (90 deg,
    McGreehan-Schotsch U1/Vi Cd), liner as MomentumChamberNode merge chambers (main_inlet + side streams).
    Gaps: the GG liner momentum gives each jet the annulus axial velocity V_A, combaero a fixed injection
    angle; growing liner and shrinking annulus areas between stations; McGreehan-Schotsch vs Dittrich-Graves
    Cd at the low-Cd upstream rows (C 0.1-0.6). Heat release is weaker (efficiency 0.4-0.9, exit T measured
    only; would need EnergyBoundary(Tt_target) per liner station with an assumed T_L(x)). Draft extraction
    with page/figure for every number: tmp/grobman_case.md (main checkout, not committed).'
  read_for: ['#793 worked examples: measured full-combustor total-pressure loss and liner airflow split', liner
      hole Cd under annulus crossflow (Dittrich-Graves vs McGreehan-Schotsch), provenance of a 1-D annulus +
      liner momentum model]
  issues: [793]
  records: []
  notes: 'Companion theory: Graves & Grobman, NACA Report 1373 (= RM E56I04), both registered. Fig. 17''s
