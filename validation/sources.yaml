  status: screened
  verdict: 'Screened 2026-11-02 for #881 (was wanted). It does NOT settle the Inconel 625 conductivity dispute,
    because it is not independent: its customary k column (68, 75, 87, 98, 109, 121, 132, 144, 158, 175
    Btu-in/ft2-h-F at RT-1800 F), cp column (0.098-0.154 Btu/lb F, which Special Metals marks "calculated")
    and density are the Special Metals Table 2/3 values digit for digit (resistivity matches in level, printed
    in other units), i.e. the same Battelle (BMI) conductivity dataset that k_inconel625 ships. Its metric k agrees with the shipped interpolation within 0.7% at 25-900 C (1000 C: 25.6 against the
    shipped table''s last row 25.2 at 982 C -- an extension past the Battelle range, provenance unstated).
    Consistency check k = alpha cp rho: NOT POSSIBLE, no diffusivity is printed. The implied alpha = k/(rho
    cp) is 2.83 mm2/s at RT to 4.68 at 1000 C; Gen3 CSP measures 22% (300 C) to 40% (700 C) more, and 28-30%
    at 800-1000 C, while Gen3 cp is 5-15% below the brochure -- the same diffusivity-driven gap already
    recorded, so Gen3 sits 16-17% above this k at 300-500 C (-1.6 to -2.0 of its 95% bands), 25-33% at
    600-700 C (-2.1 to -2.5 bands) and 10% at 1000 C (-0.6 band). Supports the shipped (Special Metals) side
    only in the sense that a second manufacturer reprints it. Independent measurements since held or located
    (2026-11-02): Du et al. 2025 (held, AM laser flash) alpha 7% above this brochure''s implied alpha at 500 C
    and 14% at 700 C, between this table and Gen3 CSP; Maglic et al. 1994 (wanted) plotted by Du 4-9% above
    it at 200-600 C. The dispute narrows but stays open until Maglic 1994 (or Touloukian/TPRC) is read.
    Shipped material data unchanged.'
