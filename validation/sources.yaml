# Source register: every local reference document under sources/ (ignored,
# copyright) -- what it is, what it holds, what it was read for, the verdict,
# and where the repo uses it. One place to answer "do we already have this?",
# "what did we conclude?" and "what else covers this?".
#
#   uv run scripts/sources.py find <terms>      search every field
#   uv run scripts/sources.py list --status unscreened
#   uv run scripts/sources.py list --wanted            documents we lack, by priority
#   uv run scripts/sources.py check             schema + unregistered local docs
#   uv run scripts/sources.py new sources/x.pdf stub entry for a new document (with its sha256)
#   uv run scripts/sources.py hash --write      fill missing sha256 values
#
# A new document gets an entry when it is screened; a verdict, issue or record
# is added here in the same PR that makes it. `read_for` lists the QUESTIONS a
# document was examined for -- a document read for one question can answer
# another (88-GT-290 was screened for overall effectiveness and later found to
# settle part of the #468 Re exponent).
#
# status: implemented (a shipped closure is built from it), fidelity (scored on
# its own data), accuracy (cross-source set), extracted (data in the repo, not
# scored), screened (verdict recorded, not used), unscreened.
# Citations are taken from the document itself; "?" marks what it does not show.
# sha256 is the file's content hash: `check` verifies it wherever sources/ is
# present, so a restored backup is proven byte-identical (#1057).
#
# Built 2026-10-25 from the documents, the extraction records, the issues and
# the project memory.

