  sha256: 'ce209877ec2a085025c11516484026e9f389b807957656ff47de1dbc4fc55e5b'
  citation: 'Humenik, F. M., Claus, R. W., Neely, G. M. (1983). Parametric study of flame radiation
    characteristics of a tubular-can combustor. NASA TM-83436, prepared for the ASME Joint Power Generation
    Conference, Indianapolis, 25-29 September 1983 (ASME 83-JPGC-GT-11).'
  id: NASA-TM-83436 (NTRS 19830020966, N83-29237)
  topic: [radiation, film]
  content: 'Open access (NTRS), 12 pp., CASI scan; text layer unusable, read from page images. NASA Lewis rig:
    one P&W JT8D tubular can in a 25.4 cm (10 in) nominal pipe housing (facility 25 atm, 870 K, 10 kg/s). NO
    liner geometry: no liner diameter or length, no louver/slot/hole dimensions or open areas, no annulus
    gap, no air split, no pressure drop. Printed stations only (Fig. 4): Gardon-type water-cooled, N2-purged
    total radiant heat flux gauges (stem through an air hole to the liner inner surface) at x = 12.7 / 18.5 /
    28.7 cm, theta 32 / 0 / 0 deg (zones 1-3 = primary, secondary, tertiary); spectral radiometer windows
    (sapphire, InSb detector, 1.5-5.5 um, one scanning head moved between ports) at x = 7.4 / 22.1 / 34.0 cm,
    theta 300 deg. Liner: 24 Chromel-Alumel thermocouples, 4 on the dome, the rest two per cooling louver on
    opposite sides, on the OUTSIDE (annulus side) of each louver (implies 10 louvers; not dimensioned).
    Table I: P3 0.34 / 0.69 / 1.38 / 2.07 MPa at T3 533 K (1.69 / 3.37 / 6.75 / 10.12 kg/s); 0.69 / 1.38 /
    2.07 MPa at 616 K (3.14 / 6.28 / 9.42); 0.69 / 2.07 MPa at 700 K (2.95 / 8.84); constant flow parameter
    m sqrt(T3)/P3 ~ 113 kg K^0.5/(s MPa); f/a nominally 0.008-0.021 (sweep 0.0087-0.0212). Table II: Jet A H
    13.9 mass %, aromatics 17.2 vol %, SG 0.8142, LHV 43304 J/g, S 0.020 %; ERBS H 12.9 %, aromatics 28.8 %,
    SG 0.8381, LHV 42200 J/g, S 0.065 %; distillation, freezing point and viscosity also printed (C/H not
    printed; 6.19 and 6.75 by difference). Data, all PLOTTED, none tabulated: Fig. 6 total radiant flux vs
    f/a for two fuel nozzles (FN-1 standard, FN-2 substitute, both dual orifice), Jet A, 533 K, 0.69 and 2.07
    MPa, 3 zones (FN-2 secondary zone 16 -> 80 W/cm2 over f/a 0.0089-0.0159 at 2.07 MPa); Fig. 7 spectral
    radiance (W/cm2 sr um) 1.5-5.5 um, f/a 0.016, 533 K, Jet A vs ERBS, 0.34 and 0.69 MPa, 3 zones; Fig. 8
    total flux vs P3 (f/a 0.016, FN-2, both fuels) at 533 K (Jet A zone 1/2/3 about 16/16/7 W/cm2 at 0.34 MPa
    to 66/78/29 at 2.07 MPa) and 616 K; Fig. 9 total flux and liner (T_local - T3) per zone, f/a 0.016, 533
    and 700 K, 0.69 and 2.07 MPa, both fuels (dT 150-300 K; ERBS up to 33 K hotter, zone 2, 0.69 MPa, 533 K).
    No gas temperature, no emissivity, no measurement uncertainty, no exit temperature or NOx table.'
  status: screened
  verdict: 'Screened 2026-11-02. Measured, but not a scorable liner case on its own. Accuracy (cross-source)
    for Lefebvre''s luminosity factor L: the only quantity it can test without assumptions is the ERBS/Jet A
    total-flux RATIO at equal P3, T3, f/a and nozzle (two H levels, 13.9 and 12.9 %, a 16 % step in L =
    336/H^2), as a function of P3 0.34-2.07 MPa and zone. An absolute R1 test needs the zone gas temperature,
    the local q and l_b (liner diameter), none of which is printed here; TM-83538 adds emissivity but not
    those either. Not a network case: no liner geometry, no air split, no pressure drop, no annulus.
    Overplotted digitising trap: Figs. 6, 8, 9 are 3-5 symbols per curve, so any score rests on about 4
    cleanly sampled points per zone per fuel. The thermocouples are outer-wall (annulus-side) values,
    reported as differences from T3 and averaged per zone, not per louver. The radiometers and the spectral
    ports sit at DIFFERENT x stations.'
  read_for: ['#793 measured liner radiant flux vs pressure and fuel H content (cross-source accuracy for L)', '#793 can geometry for a liner network case (absent)']
  issues: [793]
  records: []
  notes: 'Arrived 2026-11-02 in sources/new/ntrs_19830020966/ as 19830020966.pdf. Same rig, earlier series:
    Claus 1981 NASA TP-1722 (spectral radiance, tubular can) and Claus, Humenik & Neely 1983 NASA CP-2268 pp.
    199-206 -- wanted, may print geometry. Rudey & Graham 1984 Fig. 5 credits this TM but its idle /
    take-off points (269 kPa 400 K, 1740 kPa 715 K) are outside Table I here, so that figure draws on
    another series. ERBS is defined in Seng 1982, NASA TM-82883.'
- file: sources/radiation/Claus_Neely_Humenik_1984_NASA_TM-83538_flame_radiation_liner_heat_transfer.pdf
  sha256: '7b45e554d2f2c4e681db3cc742db8b1d90abbfcd7a2b828703e8588bea64144b'
  citation: 'Claus, R. W., Neely, G. M., Humenik, F. M. (1984). Flame radiation and liner heat transfer in a
    tubular-can combustor. NASA TM-83538, prepared for the 22nd AIAA Aerospace Sciences Meeting, Reno, 9-12
    January 1984 (AIAA 84-0443).'
  id: NASA-TM-83538 (NTRS 19840005120, N84-13188)
  topic: [radiation, film]
  content: 'Open access (NTRS), 22 pp., CASI scan; text layer unusable, read from page images. Same JT8D can,
    housing, instruments, stations (Fig. 4: total x 12.7 / 18.5 / 28.7 cm, spectral x 7.4 / 22.1 / 34.0 cm),
    Table I and Table II as TM-83436 (reprinted identically). New: test at constant reference velocity 15
    m/s (consistent with the 25.4 cm housing area: 3.37 kg/s at 0.69 MPa, 533 K gives 14.7 m/s); field of
    view 0.9 rad (total gauge) and 0.3 mrad (spectral); the 1.5-5.5 um band holds about 70 % of the total.
    Its own 1-D liner balance (after NREC 1980 design manual, ref. 9): Eq. 1 R1 + C1 = KC = R2 + C2; Eq. 2
    R2 = eps_w eps_c/(eps_c + eps_w (1 - eps_c) A_w/A_c) (T_WA^4 - T_c^4) (sigma missing in the print); Eq. 3
    C2 = h2 (T_WA - T_c); Eq. 4 h2 = 0.02 (k/D)_an Re_an^0.8 Pr_an^0.33; Eqs. 5-6 KC through a ceramic TBC
    on Hastelloy (thicknesses and k not printed); Eq. 7 C1 = h1 (T_F - T_WH); Eq. 8 h1 = 0.023 (k_f/D_ft)
    Re_f^0.8 Pr_f^0.4; Eq. 9 film F = (T_HG - T_F)/(T_HG - T_an) = 1/(1 + C_m x/(M s)) with C_m = 0.05 (ref. 10,
    Marek 1973 TM X-2809); Eq. 10 M = rho_s U_s/(rho_H U_H); Eq. 11 R1 = alpha_w R_measured, alpha_w = 0.4
    (Liebert 1978 NASA TP-1190 TBC; the NREC wall-absorptivity correction over-predicted). T_HG from the 4.5
    um CO2 band, eps_f from the spectrum assumed gray -- neither tabulated. Fig. 7 (only emissivity data):
    eps_f vs P3, Jet A, 533 K, f/a 0.016, 3 zones x 4 pressures (read by eye: primary about 0.25 / 0.68 / 0.87
    / 0.77, secondary 0.16 / 0.34 / 0.53 / 0.67 at 0.34 / 0.68 / 1.4 / 2.0 MPa); curves labelled luminous
    eps_f = 1 - exp[-0.286 Lu P (f/a l_b)^0.5 Tg^-1.5] (ref. 9, "Lefebvre") and non-luminous (Reeves, ref. 2)
    eps_f = 1 - exp[-7.1e2 P (l_b/(f/a))^0.5 Tg^-1.5]; Lu, l_b, Tg and units not printed. Plotted only: Fig.
    6 total flux vs x at an unstated condition (integrated spectral and gauge, peak about 65 W/cm2 at x about
    18 cm; zone boundaries about 15 and 26 cm); Fig. 8 spectra vs P3; Figs. 9-10 R_T and dT = T_liner - T3 vs
    P3 and T3 (zone 1 R_T 67 -> 86 W/cm2 and dT 185 -> 220 K for T3 533 -> 700 K at 2.0 MPa); Fig. 11 spectra
    vs T3; Figs. 12-14 Jet A vs ERBS (primary +56 % at 0.34 MPa, +6 % at 2.0 MPa; tertiary none); Fig. 15
    CALCULATED R1, C1, R2 + C2 (secondary zone, about 23 / 17 / 7 W/cm2 at 2 MPa; C1 is heat from wall to film,
    plotted as magnitude) and inferred h1 0.02-0.12 W/cm2 K vs Eq. 8; Fig. 16 extrapolated liner T to engine
    PR 7-60 (about 1170 K at PR 40, 1240 K at PR 60). No measurement uncertainty stated.'
  status: screened
  verdict: 'Screened 2026-11-02. The only measured flame emissivity in the radiation collection, but thin:
    12 plotted points (Fig. 7), Jet A only, one T3 and f/a, derived from a gray extension of a 1.5-5.5 um
    spectrum taken at a different x than the total gauge. Own-model fidelity: the luminous form tracks the
    primary and secondary points to about 1.5 MPa and over-predicts by 15-25 % at 2.0 MPa (blamed on nozzle
    atomisation); Reeves over-predicts the tertiary zone at high P3. Not reproducible by us, since Lu, l_b
    and Tg are not printed. Discrepancies with Lefebvre & Ballal: the luminous coefficient 0.286 with P in
    Pa is 1.4 % below L&B''s 290 with P in kPa (or a different edition); the non-luminous form prints
    (l_b/(f/a))^0.5 and 710, not Reeves'' (q l_b)^0.5 with L = 1 -- likely a typo, unusable as printed. Its
    R1 uses a measured flux times alpha_w 0.4 (TBC), so the liner surface is NOT the bare-metal eps_w 0.7-0.8
    of L&B; any liner-temperature comparison must model the TBC. The film form (Eq. 9) is the Juhasz-Marek /
    Marek-Tacina developed-region law combaero ships; C_m 0.05 equals Marek-Tacina C_m = 0.25 Tu/100 at Tu
    20 %. Fig. 15 closes (R1 - C1 about equal to R2 + C2) but is a calculation, not data. Accuracy use: the
    ERBS/Jet A ratio test of L (with the paper''s statement that the 4.5 um band, i.e. Tg, is unchanged
    between fuels) and the shape of eps_f vs P3 against Reeves x L with an assumed l_b. Not a full liner
    network case (no geometry, slots, air split, dp, annulus, wall build-up).'
  read_for: ['#793 measured flame emissivity vs pressure (cross-source accuracy for Reeves eps_g x L)', '#793 a published 1-D liner balance with a Marek film term (method check)']
  issues: [793]
  records: []
  notes: 'Arrived 2026-11-02 in sources/new/ntrs_19840005120/ as 19840005120.pdf. Screening estimate (not a
    record): with Fig. 7 Jet A eps and eps_ERBS = 1 - (1 - eps_JetA)^(L_E/L_J), the predicted ERBS/Jet A ratio
    at 0.34 MPa primary is 1.14 for L = 336/H^2, 1.32 for 3 (C/H - 5.2)^0.75, 1.31 for Kretschmer-Odgers and
    1.50 for 7.53 (C/H - 5.5)^0.84 against 1.56 measured; at 2.0 MPa 1.06 / 1.13 / 1.13 / 1.18 against 1.045. No
    form fits both ends. Leads for geometry and closures (wanted): Srivatsa NASA CR-167930 (predicted this rig,
    Rudey & Graham Fig. 5), NREC 1344-2 (1980) design manual (ref. 9), Liebert 1978 NASA TP-1190 (alpha_w),
    Marek 1973 NASA TM X-2809 (C_m at pressure), Claus 1981 NASA TP-1722.'

- file: sources/heat_transfer/film/Poettgen_2020_MS_UConn_effusion_jets_vitiated_crossflow_LRS.pdf
  sha256: '7018942388acbdf62065578b4fe522b47f99ca7c75e3468130f9ce32641e2ba1'
  citation: Poettgen, B. (2020). Experimental methods for studying mixing and heat transfer characteristics
    of effusion jets in a vitiated crossflow. MS thesis, University of Connecticut, Master's Theses 1515
    (major advisor B. M. Cetegen).
  topic:
  - effusion
  - film
  content: 'Open access, 87 pp., text layer. UConn CGDL rig (the Pratt & Whitney sponsored project): premixed
    propane-air pilot, vitiated crossflow ~1500 K at 7.6 m/s, atmospheric, rectangular test section.
    Effusion plate: Inconel 625, 2.29 mm thick, 2 staggered rows, 20 holes laser drilled at 30 deg forward,
    spanwise pitch 6.35 mm, row pitch 7.62 mm (hole diameter only on Fig. 17, not in the text); plenum fed,
    coolant air (DR 3.05) or CO2 (DR 4.65) at 500 K, BR 5, 7 and 10, jet Re 205-449. Planar laser Rayleigh
    gas temperature images (mean, instantaneous, RMS) parallel to the plate at 2-3.5 mm. An IR method for
    surface temperature through the vitiated flow is developed (window, gas emission, calibration) but NO IR
    data were taken (COVID-19 lab shutdown, Sec. 5).'
  status: screened
  verdict: 'Screened 2026-11-08. Does NOT plug the gas-side h gap (#476) it was wanted for: no surface
    temperature, heat flux or h was measured, only preliminary LRS gas-temperature images, plotted, at high
    BR (5-10) with low jet Re and a single 2-row plate. Nothing to score. Value: (a) the rig definition for the
    follow-on papers (Grasso, Snyder & Cetegen 2022 JHT, held; the IR companion announced for IJHMT) --
    those, not this thesis, would hold the hot-side h; (b) its literature review is a pointer list of hot
    effusion experiments. A liner case (crossflow along the plate), not a front plate facing burners.'
  read_for:
  - '#476 gas-side h / augmentation on an effusion plate in a hot vitiated crossflow -- not here (IR never acquired)'
  - can-annular front plate with several burners -- not here (crossflow along a side wall)
  issues:
  - 476
  records: []
  notes: 'Journal version of the LRS work: Grasso, Snyder & Cetegen 2022, J. Heat Transfer 144(1) 012301
    (held, screened 2026-11-08). It reports a DIFFERENT coupon (14 x 12 holes, 25 deg, d 0.56 mm, plus a
    6.35 mm anchoring jet) and CO2 coolant only, and still no surface temperature or h. The IR companion this
    thesis announced for IJHMT is not cited there; it remains the #476 lead.'

- file: sources/heat_transfer/film/Grasso_Snyder_Cetegen_2022_JHT_144_012301_effusion_LRS_gas_temperature.pdf
  sha256: '1950046548f1c6e34c3b123a38669f72028ff470d23f00439a19d8f4a4cbdd0b'
  citation: Grasso, G. S., Snyder, K. R., Cetegen, B. M. (2022). Application of planar laser Rayleigh scattering
    for measurement of gas temperature distributions in effusion jet cooled panels exposed to high temperatures.
    ASME J. Heat Transfer 144(1), 012301. doi:10.1115/1.4052509
  topic:
  - effusion
  - film
  content: 'Paywalled (ASME), 11 pp. UConn rig: swirl preburner, premixed propane-air phi 0.87, vitiated
    crossflow 1500 K +- 1 %, 7.6 m/s +- 3 % (bulk about 7.5 m/s; Fig. 4 PIV and radiation-corrected R-type
    profiles, boundary layer about 5 mm, gas 1300 -> 1500 K across it), atmospheric, 3.81 x 7.62 cm test
    section. Effusion coupon on one side wall (crossflow along it): laser drilled, 14 x 12 holes, nominal 25 deg
    streamwise, d 0.56 mm; pitches, plate thickness and material NOT printed (Fig. 3 sketch only); a 6.35 mm
    anchoring jet downstream. Coolant CO2 (air also run, not reported) at 490-505 K; DR not stated (about 4.5
    by ideal gas). BR 1.12, 2.22, 3.35, 5.55, 7.8, 11.1, global, from a flow test with Cd-corrected hole area.
    Planar laser Rayleigh gas temperature parallel to the plate at 2, 2.75, 3.5 mm (about 3.6-6.3 d), 250
    images per case at 1 Hz; temperature pegged per image to the upstream thermocouple and the anchoring-jet
    thermocouple (two-point solve for C and I_BG, Eqs. 11-13). Uncertainty +3.5/-2.5 % (+35/-37.5 K), from
    ref. 28. Plotted only: mean T (Fig. 8), instantaneous (Fig. 9), RMS (Fig. 10), gas-phase FE maps (Fig.
    11), spanwise-averaged FE vs x/d, all BR x 3 heights (Fig. 13), spanwise slices (Fig. 14), spatial RMS
    (Fig. 15). FE = (T_CF - T_xy)/(T_CF - T_coolant) with T_xy the GAS temperature at height h. A sapphire
    window allows back-side IR imaging of the plate; no IR data are reported.'
  status: screened
  verdict: 'Screened 2026-11-08. Does NOT plug #476: no surface temperature, heat flux or h anywhere, only gas
    temperature, its RMS and a gas-phase film effectiveness at 2-3.5 mm above the plate. That FE is a
    mixing measure at a height (3.6-6.3 d), not an adiabatic wall effectiveness: it is zero where the film is
    thinner than the sheet height and cannot be scored against eta_aw kernels. The temperature pegging
    calibrates each image on two points of known T and composition; how the Rayleigh cross section is set in
    the CO2 / product mixing layer, where composition is unknown, is not stated, so film temperatures carry
    an unquantified composition bias beyond the quoted band. Not the Poettgen 2020 plate (that was 2 rows, 20
    holes, 30 deg, 2.29 mm Inconel 625); this is a 14 x 12, 25 deg, 0.56 mm coupon with no pitch or thickness
    printed. Does not cite or name the IR heat transfer companion. A liner-type crossflow, not a front plate.
    Nothing to score for anything combaero ships (no model of ours predicts gas temperature at a height);
    qualitative only: film onset moves upstream (from hole column 4-5 to 3) as BR rises 3.35 -> 11.1.'
  read_for:
  - '#476 gas-side h on an effusion plate in a 1500 K vitiated crossflow -- not here (gas temperature only, IR not reported)'
  - can-annular front plate with several burners -- not here (side-wall plate in a crossflow)
  issues:
  - 476
  records: []
  notes: 'No figure worth digitising for combaero. Uncertainty method is in ref. 28: Dayton, Poettgen,
    Linevitch, Cetegen 2019, Phys. Fluids 31(12) 125104 (jet in hot crossflow, near field). The #476 target
    remains the UConn IR companion announced in Poettgen 2020 (IJHMT); neither document gives a citation.
    Arrived 2026-11-08 in sources/new/oa_swirl_1108/ as ht_144_01_012301.pdf.'

