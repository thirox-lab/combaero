- file: sources/materials/zhu_miller_nagaraj_bruce_2000_NASA_TM-2000-210238_EBPVD_conductivity.pdf
  sha256: 'df62baae1eb2f754955a3158da57118b05b276a9a1f63b8a360b924dea3aa1e3'
