# Behrendt, Lengyel, Hassa & Gerendas (2008) -- total cooling effectiveness of
# effusion liner samples in a REACTING hot-gas flow at 5 and 10 bar.
#
# WHY THIS SOURCE. Every other effusion set here is atmospheric and
# non-reacting: Andrei 2014 is adiabatic PSP, Andrews 88-GT-290 a transient
# heated plate, Jackowski 2021 electrically heated air. This is the first
# heated-wall overall-effectiveness set measured behind a kerosene combustor
# (DLR Cologne high-pressure cooling rig), at p_h 5 and 10 bar, near-wall gas
# 1530-1570 K, with the coolant temperature, pressure drop and hole angle
# varied one at a time. It is a cross-source ACCURACY set for
# EffusionPlateElement's eta_overall at combustor conditions, never fidelity
# (no correlation of the authors' to reproduce) and never a tuner
# (docs/VALIDATION_POLICY.md). Record:
# validation/cooling/extractions/behrendt_2008_effusion_eta_tot.md.
#
# WHAT eta_tot IS. TOTAL (overall) effectiveness on a conducting Nimonic 75
# wall, NOT adiabatic film effectiveness -- the authors say so (p. 1807: "the
# wall samples were not adiabatic ... the total cooling effectiveness is
# given here and not the film cooling effectiveness"). Eq. (2):
#     eta_tot(x/d, z/d) = (T_h(x/d=-10, z/d) - T_w(x/d, z/d)) / (T_h(x/d=-10, z/d) - T_c)
# T_w by IR thermography (InGaAs, 0.9-1.7 um, background-radiation corrected,
# anchored on embedded thermocouples); T_h is the NEAR-WALL gas temperature
# measured at x/d -10, y/d 4 (not a bulk or flame temperature); T_c the
# nominal coolant temperature measured y/d ~15 behind the sample. Laterally
# averaged over -17.1 < z/d < 8.6 (three lateral periods). Declared as
# eta_overall in conventions.py; a model scored against it must use the
# near-wall T_h as its gas temperature.
#
# UNCERTAINTY. The authors state a maximum measuring uncertainty
# d eta_r,tot <= 3% (p. 1807), RELATIVE (the subscript r; their dp-effect
# "2...3%" in the same notation is 0.790 -> 0.805 on Fig. 9). The schema's
# band is relative too, so `uncertainty: 0.03` on every eta series is the
# authors' number unchanged -- a measurement statement, constant over the
# source, never derived from a model's error. It is a worst-case bound
# (T_h fluctuation +/-25 K, thermocouple depth 7 K, emissivity scatter
# +/-12 K), not one sigma.
#
# EXTRACTED FROM THE PDF VECTOR STREAM, NOT DIGITISED. Each curve is one
# stroked polyline (PyMuPDF get_drawings), mapped to data by a least-squares
# fit on every labelled major tick (labels from the page text layer):
# residuals <= 1e-3 x/d and <= 4e-7 eta on every figure, all minor-tick
# spacings uniform to < 0.01 pt (linear axes). Rasterised independently by
# poppler for the overlay review; user-confirmed 2026-11-08 ("looks perfect").
#
# ONE COPY OF EACH CURVE. Three curves are printed twice, with independent
# calibrations, and agree to 1e-5 in eta_tot -- that agreement is the
# extraction's cross-check, and only one copy is committed:
#   Fig. 5 E20            == Fig. 9 dp 3%        (1.05e-5, 85 abscissae) -> Fig. 9
#   Fig. 5 E30            == Fig. 6 Tc 540 K     (1.0e-5, 93)            -> Fig. 6
#   Fig. 6 Tc 470 K       == Fig. 10 5 bar dp 3% (9e-7, 116)             -> Fig. 6
# Rule: keep the copy in the earliest one-parameter SWEEP figure (6, 9, 10);
# Fig. 5 only compares two sweep members. So Fig. 5 has no series of its own
# and no redraw, and the Fig. 10 redraw lacks its 5 bar dp 3% curve (it is
# fig6_eta_tot_E30_Tc470.csv). 9 distinct eta curves, 12 series with Fig. 8.
#
# THE CLIPPED LAST VERTEX IS DROPPED. Every polyline ends on the right frame
# (x/d 50 or 58): the plotting program's clip point, not a measured station.
# It is not in the CSVs. Vertices are otherwise the plotted points, spacing
# 0.340 x/d (E30) and 0.367 x/d (E20); curves start at x/d 18.1 because the
# authors exclude x/d < 16 (starter-film dominated in an engine).
#
# GEOMETRY (Behrendt et al. 2008 pp. 1803-1804, and the ICAS 2006 rig paper):
#   hole diameter d   ~0.70 mm  INFERRED, not printed: l/d 143 with l = 100 mm
#                     and b/d 114 with b = 80 mm (ICAS 2006). Confirmed: Eq. (5)
#                     (Hausen) at that d reproduces Table 4's h_e -- Nu 16.3
#                     vs 16.8 at Re_e 4600, 34 vs 35.3 at 9650.
#   wall              t/d 2, NIMONIC 75 (2.4951)
#   hole angle        20 deg (E20) or 30 deg (E30), no compound angle;
#                     L/d = (t/d)/sin(beta) = 5.85 / 4.0, derived
#   pitch             sx/d 5 streamwise, sz/d 8.6 lateral, rows staggered,
#                     pattern repeats every 5 rows
#   upstream          NO starter film; boundary-layer bleed at dx/d -21
# The impingement-backed samples I20/I30 are in the paper (Fig. 4) but not
# plotted as profiles; not extracted.
#
# CONDITIONS per series are in `geometry` (as hay1983 does): p_h, near-wall
# T_h (1567 K TC1, 1532 K TC2) and u_h (29.7 / 29.1 m/s, LDA), Table 2;
# T_c, dp_r,c, M and I as printed in each legend. Note: the paper's TC1/TC2
# are NOT the ICAS 2006 paper's TC1-TC4 labels.
#
# KNOWN INPUT CAVEATS -- read before scoring anything against this set:
#   * M and I are the authors' MODEL estimates (the coupled 1-D wall model of
#     Martiny et al. 97-GT-329, cD from Martiny 1999), not measured: the hole
#     exit temperature is 40-70 K above T_c and could not be measured.
#   * About 40% of the preheated cooling air cooled the module around the
#     sample (footnote 3, p. 1811); the split was measured only cold, so the
#     sample's coolant mass flow, hence M, is approximate.
#   * Free-stream turbulence Tu 19-24% (ICAS 2006), swirling combustor exit
#     flow, laterally non-uniform T_h (Fig. 3: 1436-1570 K).
#   * Fig. 8 heat flux is BIASED: the Vatell sensor replaces two cooling holes
#     and shifts the heat exchange toward the coolant side (authors, p. 1811).
#     Committed as measured data, never for scoring.
#
# SCORED (eta series): validation/cooling/effusion_network_runner.py builds the
# rig as a network and reads EffusionPlateElement's eta_overall, at both
# gas-side baselines (`chamber`, `flat_plate` from the bleed). The Fig. 8
# heat fluxes stay `scores: null`.

paper:
  name: behrendt2008
  citation: >-
    Behrendt, T., Lengyel, T., Hassa, C. and Gerendas, M. (2008).
    "Characterization of advanced combustor cooling concepts under realistic
    operating conditions." ASME Turbo Expo 2008, GT2008-51191, Vol. 4,
    1801-1814. DOI 10.1115/GT2008-51191.
  secondary: false

