- file: sources/materials/Du_2025_MaterDes_251_113333_binder_jet_IN625_LFA.pdf
  sha256: 'e36244f727bca1c957f589241790d28dc6641d9e7ebde61282f218a35389c5ba'
  citation: Du, W., Hayes, J., Myers, A., Barua, B., Yu, X., Singh, D. (2025). Development of a high-temperature
    Inconel 625 heat exchanger by model design and binder jetting additive manufacturing. Materials & Design 251,
    113333.
  topic: [other]
  content: 'Open access (CC BY-NC), 15 pp. Binder-jet Inconel 625, sintered at 1305 C to 8.40 g/cm3 (99.5% of
    8.44; Table 3). Laser-flash diffusivity (TA DXF 900, flowing N2) of sintered disks at 25/250/500/700 C:
    2.72 +- 0.01, ~3.35, ~4.07 and 4.63 +- 0.05 mm2/s (25 and 700 C printed in the text; 250 and 500 C read
    from Fig. 11 p. 9, where those points sit at about 240 and 495 C). k = alpha rho cp gives 9.4 +- 0.02 W/m K
    at 25 C to 22.5 +- 0.22 at 700 C, with cp BORROWED from High Temp Metals tech data (ref. 27) and the
    measured density, so only alpha is independent. Fig. 11 also plots literature k: High Temp Metals (ref.
    27), Special Metals (ref. 35, the Battelle data) and Maglic, Perovic & Stanimirovic 1994 (ref. 34). Rest of
    the paper: powder, binder, printing and sintering, a sCO2 / molten-salt channel model (MOOSE) and a
    printed prototype HX test.'
  status: screened
  verdict: 'Screened 2026-11-02 for #881 (Inconel 625 conductivity, Special Metals/Battelle vs Gen3 CSP). An
    INDEPENDENT diffusivity measurement, on additively made material. Against the shipped k_inconel625 data
    (Special Metals Table 3, Battelle, as reprinted by Haynes): alpha_Battelle = k/(rho cp), rho 8440, is 2.83 /
    3.36 / 3.80 / 4.07 mm2/s at 25 / 250 / 500 / 700 C, so measured/Battelle = 0.96 / 1.00 / 1.07 / 1.14. The
    measurement rises above Battelle from 500 C, the same direction as Gen3 CSP (+25-33% in k at 600-700 C,
    diffusivity-driven) but about half the size. Maglic 1994 as plotted in Fig. 11 (read from the 500-dpi page
    image, triangles): about 13.0 / 14.5 / 16.2 / 17.8 / 19.9 W/m K at 200 / 300 / 400 / 500 / 600 C, i.e. 4-9%
    above Battelle (12.5 / 13.9 / 15.3 / 16.9 / 18.3) and on this paper''s own k line (which uses the High
    Temp Metals cp), not on the Battelle points (Special Metals diamonds 16.8 at 500 C, 19.9 at 700 C).
    Caveats: AM microstructure (residual porosity of ~0.5% would LOWER k, so the excess is not a porosity
    artefact), only 4 temperatures, cp not measured. Ordering of the independent measurements: Gen3 CSP
    highest, this paper intermediate (+14% in alpha at 700 C), Maglic 1994 as plotted slightly above Battelle
    (a direct read of Maglic is wanted). Shipped material data unchanged: the dispute narrows (two independent
    sets above Battelle at 500-700 C, by 7-14% and 25-33%) but no single replacement is better sourced.'
  read_for: ['#881 independent Inconel 625 diffusivity / conductivity (third source)']
  issues: [881]
  records: []
  notes: 'Supplied by the user 2026-11-02. Leads: Maglic, Perovic & Stanimirovic 1994 (Int. J. Thermophys. 15,
    741-755; wanted, the tie-breaker); High Temp Metals tech data (vendor web page, ref. 27; its k points in
    Fig. 11 lie above Battelle from ~300 C, provenance unstated). Not checked: the HX model and test sections.'

