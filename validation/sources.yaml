- file: sources/orifices/reader-harris_sattary_1996_rhg_equation_iso5167-1.pdf
  sha256: '64382580bf9957b0ac88b64d67b5f7046e82602b1596faea203989c74943336d'
  citation: 'Reader-Harris, M. J., Sattary, J. A. (1996). The orifice plate discharge coefficient equation --
    the equation for ISO 5167-1. National Engineering Laboratory, East Kilbride (paper 24, 14th North Sea Flow
    Measurement Workshop).'
  topic: [orifice]
  content: 'Derivation of the "Agreed Equation" (RHG) on the EEC/API database (16522 points, D 50-600 mm,
    beta 0.1-0.75, corner/flange/D-D/2 taps; Table 4 bins Re_D from "10 to 4000" up to "1e7 to 1e8" --
    bin edges, not data limits: no lowest Re_D is stated anywhere in the text or tables). Eq. (10) is the full
    form fitted to all data,
    including Re_D < 4000 (a max(...) branch in the beta^3.5 term and a 1 + 8 max(log10(3700/Re_D), 0) factor
    on the downstream tapping term); Eq. (11a)+(11b) is its Re_D >= 4000 form, the one in ISO 5167-2 Eq. (4).
    Residual tables 2-8 by beta, D, Re_D and taps (s = 0.259 % for Re_D >= 4000; 0.59 % in the Re_D 10-4000 bin,
    470 points, mostly beta <= 0.375); Table 10 compares Stolz ISO 5167-1:1991 over its range (s 0.390 %)
    without stating that range; Eqs. (12)-(21) show the expansibility choice moves C by <= 0.04 %.'
  status: implemented
  verdict: 'Read 2026-10-31. Primary of the implemented RHG: our metering_cd_and_dRe is Eq. (11a)+(11b), already
    checked against the held ISO 5167-2 Annex A. Eq. (10) is a published, data-fitted extension below Re_D 4000
    that rises faster than Eq. (11) (beta 0.5, D 50 mm: 0.735 vs 0.684 at Re_D 1000); it is C0 but not C1 at
    Re_D ~ 3700 and still unbounded as Re_D -> 0. Not implemented; #873 holds Cd below the ISO bound instead.
    Does not give the Stolz limits of use (#873 wanted entry for ISO 5167:1980 stays open).
    #878 (2026-10-31) tried Eq. (10) below Re_D 4000 against pre-registered criteria and DROPPED it on
    criterion 3: the paper gives no data floor (lowest Re_D) at any beta, so the hold Eq. (10) would need has
    no sourced start. Fidelity passes (transcription term by term; equals Eq. (11) to 0 for Re_D >= 3687.2,
    the max() crossing; the log10 switch is at 3700). The gap between Eq. (10) and the #873 hold exceeds the
    cell''s rms about Eq. (10) only below Re_D ~2500-3700 for beta 0.1-0.57 (everywhere in the bin at beta
    0.66, 5 points), and the tables do not say where in 10-4000 the 470 points lie. Those rms values are
    in-sample (the data shaped the low-Re terms). Numbers in #878.'
  read_for: ['#854 RHG primary', '#873 low-Re hold', '#878 Eq. (10) below Re_D 4000']
  issues: [854, 873, 878]
  records: []
