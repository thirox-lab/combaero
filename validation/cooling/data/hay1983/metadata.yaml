  name: hay1983
  citation: >-
    Hay, N., Lampard, D. and Benmansour, S. (1983). "Effect of Crossflows on
    the Discharge Coefficient of Film Cooling Holes." ASME J. Engineering for
    Power 105(2), 243-248. Paper No. 82-GT-147.
  secondary: false

