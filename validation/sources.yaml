  topic: [orifice]
  content: 'History of ISO 5167: first edition 1980 (orifice plates, nozzles, Venturi tubes) with the Stolz
    orifice-plate C equation; a minor revision in 1991 (Stolz [1]); the Reader-Harris/Gallagher (1998) equation
    by ISO 5167-1:1991/Amd 1:1998; a major revision in 2003; RHG kept in ISO 5167-2:2003 and 2022. Plate
    edge-thickness data (Beitler and others, Figs. 1-2): ISO 5167-2:2022 adds e/d <= 0.1 to 0.005 <= e/D <=
    0.02. Prints no limits of use for Stolz.'
