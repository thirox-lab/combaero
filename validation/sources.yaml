- file: sources/heat_transfer/film/Kirollos_Povey_2015_JEGTP_137_122608_energy_based_film_superposition.pdf
  sha256: '8c8bb898e53f70e1400826c481f58d60ebfccc18daf76c1ebdf7bd200c551423'
  citation: Kirollos, B., Povey, T. (2015). An energy-based method for predicting the additive effect of multiple
    film cooling rows. ASME J. Eng. Gas Turbines Power 137(12), 122608.
  id: doi:10.1115/1.4030907
  topic: [film]
  content: '7 pp., text layer good. Reviews additive models: Sellers (Eq. 1) and its recursive form (Eq. 4); Le
    Grives & Nicolas, two staggered rows at p/D < 4 (Eq. 6); the a(M), b(M) weighted two-row form (Eq. 7). It
    then proposes an energy-conserving stratified-layer model. The entrained mainstream mass per layer is m_ei =
    m_ci (1/eta_i - 1) (Eq. 8), from each row''s single-row eta_i(x). Entrainment into lower layers is at the
    temperature of the layer above. The layer total temperatures follow from integral relations (Eqs. 10-13).
    The model needs each row''s coolant mass flow, as well as its eta_i(x).'
  status: screened
  verdict: 'Screened 2026-11-02. Sellers does not conserve energy, and it under-predicts the combined
    effectiveness for n > 2 rows; the gap grows with n. In their test it is below for x/D > 50. The energy model
    always predicts a higher eta than Sellers for n > 2. The test case is CFD only (6 staggered rows in a
    converging duct), with no experiment. The paper says data for validation are scarce, and it is copyright
    Rolls-Royce plc. Relevance: EffusionPlateElement uses Sellers superposition over many rows (29 rows in
    Caciolli, combustor liners). Our film runner on Andrei 2014 (Baldauf + Sellers) has an MAE of 45.5%, and its
    error changes sign with BR. So the energy model is a candidate alternative superposition for high row
    counts. Implementing it means integrating Eqs. 10-13 per row with analytic derivatives. It is not
    implemented, and it has not been checked against our effusion data.'
  read_for: ['#387 superposition over many effusion rows (Sellers vs energy-based)']
  issues: [387]
  records: []
