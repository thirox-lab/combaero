  topic: [film, review]
  content: 'Open access (euroturbo.eu, copyright the authors), 13 pp. High-porosity (P/d ~2, porosity ~20%)
    staggered film panels on a turbine blade in a high-speed cascade (Oxford). Review of slot and transpiration
    film models with equations: Goldstein & Haji-Sheikh heat-sink correlation (Eqs. 3-5, porous sections and
    slots), Sturgess 1986 three-region slot model (Eq. 6, form only), Hatch & Papell 1959 (Eq. 7), Sellers
    superposition (Eq. 8) and the Kirollos-Povey correction (cited), Goldstein 1971 point-sink hole model (Eq.
    9). New: Eq. 10, eta = exp[-(C2 h x d/(m cp) + C1)] exp[-0.693 (y/h)^2] per hole with Sellers superposition,
    h the flat-plate h at the hole (Eq. 11 turbulent, Eq. 12 laminar). C1 (vs VR) and C2 (vs BR) are fitted
    per geometry and PLOTTED only (Figs. 8, 9, 11, 12; legends partly unlabelled), suction and pressure surface
    and Courtis 2021 flat plate. R2 0.985-0.999 per geometry, 0.92-0.99 with spline-fitted C1/C2.'
  status: screened
