- file: sources/heat_transfer/film/Seban_1960_JHT_82_303_tangential_slot_film_h_and_eta.pdf
  sha256: '30c6875770f648e93c974d23f8dc4081066873b32a45df19b0c5684d3d271ab6'
  citation: Seban, R. A. (1960). Heat transfer and effectiveness for a turbulent boundary layer with tangential
    fluid injection. ASME J. Heat Transfer 82(4), 303-313 (November 1960; ASME Paper 59-A-177).
  topic: [film]
  content: 'ASME Digital Collection download, 10 pp.; equations and tables read from page images. Tangential
    slot at the leading edge of a 12 in. wide, 18 in. long bakelite plate (top wall of a 4.5 x 12 in. tunnel),
    air into air, slot heights s = 0.250, 0.125 and 0.063 in. (lip 0.020 in.), free stream 50-150 ft/s (most
    runs 118-123 ft/s), injection 0-70 F above the free stream (rho_1/rho_s 1.06-1.14, so velocity ratio ~
    mass-velocity ratio m). Adiabatic runs give eta = t_a/t_s; heated runs (five nichrome ribbons) give h =
    q/(t_o - t_a) on the ADIABATIC-WALL temperature of the same flow (Eq. 3; flux error up to 4-5%). Tables 1/2
    PRINT per run s, m, u_s, u_1 and Re_s = u_s s/nu_s (m 0.18-0.88 and 1.06-20.75). m < 1: power-law region
    from (x/s)_1 = 56 m^1.5 (Eq. 4), eta = 25 m^1.2 (x/s)^-0.8 (Eq. 5, Fig. 5); h equals the plain flat-plate
    Colburn value h_0/(rho_1 u_1 cp) = 0.037 Re_x^-0.2 (Eq. 9) within about 70 slot heights (Fig. 8, h/h_0 ~ 1
    from x/s ~ 10-70; near the slot separation, maximum at x/s ~ 6, Fig. 9). m > 1: Chin''s group B with eta =
    3.93 B^-0.40 (Eq. 10, Chin''s fit, 1.21 < u_s/u_1 < 1.65), Seban''s eta = 3.63 B^-0.56 for m > 2.5, B > 20
    (Eq. 11) and eta = 1.09 C^-0.5, C = (rho_1/rho_s)^1.5 ((u_s - u_1)/u_s)^0.5 Re_s^-0.3 (x/s), for all m >=
    1.08 including the wall jet (Eq. 12, Fig. 11). Heat transfer for m > 1 (Fig. 12): h/(rho_s u_s cp) = 0.10
    Re_s^-0.3 (x/s)^-0.3 for x/s < 40 (Eq. 13) and 0.41 Re_s^-0.3 (x/s)^-0.6 for x/s > 40 (Eq. 14), called "a
    convenience" (a single 0.6-power law with a shifted origin would fit most of the data); Jakob''s wall-jet
    h = 0.15 Re_s^-0.2 (x/s)^-0.6 (Eq. 15), on the maximum boundary-layer temperature, plotted alongside.
    At m ~ 1 h drops to flat-plate values almost at once; at m = 2 it stays above them over the plate.'
  status: implemented
  verdict: 'Screened 2026-11-02 (was wanted); Fig. 12 digitised and implemented 2026-11-03 (#962). THE PRINTED
    Eq. 13 CONSTANT 0.10 IS A MISPRINT; the curve B Seban DREW is 0.135 (user sign-off 2026-11-03). Three
    independent checks: (1) the drawn B and C cross at x/s 37 ((0.40/0.135)^(1/0.3) = 37.4), where the
    text switches from Eq. 13 to Eq. 14 ("x/s = 40"); the printed pair would cross at 110 and leave a 26 %
    step at 40; (2) Fig. 9 back-solves to 0.140-0.144; (3) the digitised Fig. 12 points (38 at x/s 4.8-38.4,
    5 clean, 26 stacked, 7 ambiguous) fit 0.1336 at the fixed -0.3 slope, every data variant 0.1296-0.1339
    (bootstrap 90 % CI 0.127-0.139). Curve C is 0.400 on the trace against the printed 0.41. Consequences:
    the Cranfield SME4 report''s 0.090 is this curve/data x Pr 0.69 (0.090-0.093), not an error; Lefebvre &
    Ballal Eq. 8.41''s 0.069 = printed 0.10 x Pr 0.69 inherits the misprint. Run 128 (the one identified
    run near m = 1, m 1.10) sits on 0.069, 25 % below curve B, consistent with h falling to flat-plate
    values as m -> 1 (Fig. 8: plain flat-plate h for m < 1). IMPLEMENTED as the default film-side h
    (slot_film_htc_seban_1960; SlotFilmElement film_htc="seban1960"): St_s on slot-fluid properties, curves
    B (0.135) and C (0.40) C1-blended over +-0.1 decade at their crossing, span-mean over the wall, handing
    back to the duct h past x/s 300 and below m = 1.0; box (flagged): x/s 4-300, m 1.06-8.91, Re_s
    1.4e3-8e3. FIDELITY on his own Fig. 12 (upper bound, overplotted): bias -1.0 %, RMS 11 %; the printed
    0.10 is 25 % low on the same points. Curve C (x/s > 40) not scored: no point beyond 40 digitised. As
    an accuracy source for Marek-Tacina it is cross-source (different lab), but tangential thin-lip,
    low-Tu, DR ~1.'
