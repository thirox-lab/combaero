- file: sources/radiation/bordbar_et_al_2021_IJHMT_173_121207_pressure_dependent_WSGG.pdf
  sha256: '164641ef7c531fb1e35c3c9e94350010b10b844e4a2a02008375b605689b448a'
  citation: 'Bordbar, H., Coelho, F. R., Fraga, G. C., Franca, F. H. R., Hostikka, S. (2021). Pressure-dependent
    weighted-sum-of-gray-gases models for heterogeneous CO2-H2O mixtures at sub- and super-atmospheric pressure.
    Int. J. Heat Mass Transfer 173, 121207.'
  id: doi:10.1016/j.ijheatmasstransfer.2021.121207
  topic: [radiation, combustion]
  content: 'The Bordbar et al. (2014) WSGG formulation (Mr in the coefficients) extended to total pressure: ten
    SEPARATE coefficient sets for p = 0.1, 0.5, 1, 2, 5, 10, 20, 30, 50, 80 atm; T 300-3000 K, Mr = H2O/CO2
    0.1-4 (33 discrete values fitted), LBL from HITEMP2010 over 150-25000 cm-1. Weights a_i polynomial in
    T (b_ij) with b_ij = sum_k c_ijk Mr^(4-k), absorption kappa_p,i = sum_k d_ik Mr^(4-k) (Eqs. 8-11). Table 1
    surveys earlier pressure-dependent WSGG models (Bahador & Sunden, Coelho & Franca, Shan et al., Wang &
    Xuan). Validated against LBL on 1-D slabs (isothermal/homogeneous and varying T, composition and Mr);
    average errors < 5% (Shan''s model > 6% at best, Table 2). Non-luminous: no soot.'
  status: screened
  verdict: 'Screened 2026-10-28: the pressure coverage Bordbar et al. (2014) lacked -- gas-turbine liners at
    10-40 bar sit inside 0.1-80 atm -- the candidate non-luminous gas emissivity at combustor pressure. LICENCE:
    the article is CC BY 4.0 (printed on p. 1; the publisher''s permissions page states no permission is needed
    to reuse it), so the Appendix A constants (supplement mmc1) may be implemented with a citation; the mmc2
    files carry the author''s own non-commercial notice and are never used or shipped. FIDELITY (2026-11-09,
    #1071, scratch only): the model exactly as Eqs. 7-11 state -- eps = sum_i a_i [1 - exp(-kappa_p,i (p_H2O +
    p_CO2) L)], kappa in 1/(atm m), a_i = sum_j b_ij (T/1500 K)^j, b_ij and kappa as quartics in Mr with k = 0
    on Mr^4 -- reproduces the paper''s own 1-D slab model curves (Figs. 3-5, p = 0.5, 1, 30 atm; 18 vector-exact
    curves, 3609 points; own RTE solve) to max 1.25%, mean 0.28% of the normalised source/flux, and against the
    plotted LBL points gives errors matching Table 2 (e.g. p 30 atm Case 2: 10.3/3.0% vs 10.0/2.82%). No
    reinterpretation (kappa x (x p)^2, T/1200 K, reversed powers) does. Fig. 2 (emissivity charts) does NOT
    follow Eq. 7: at 0.1 atm it matches a pressure path p^2 L -- the MATLAB function''s emissivity output counts
    (x_H2O + x_CO2) p twice (its RTE outputs a_wsgg/kk_wsgg are right) -- and at 80 atm, L >= 0.75 m, nothing
    fits; a question for the author, not a blocker. Seven of the ten sets are untested by any figure under Eq.
    7. On the DLR 2008 effusion rig Lefebvre Eq. 8.11 sits 3-12% above Appendix A at 5 bar and 32-41% above at
    10 bar (cross-source). An implementation must interpolate eps (never coefficients: gray gas i is a different
    band in each set; neighbouring sets differ 2-5% at the same state, so d eps/dp kinks at the nodes), clamp Mr
    to the fitted 0.1-4 (the quartics diverge outside), define Mr as x -> 0, stay at T <= 3000 K (eps < 0 near
    3500-4000 K), and bound eps (sum a_i reaches 1.039 at 2 atm).'
