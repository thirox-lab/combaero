# Naik, S., Retzko, S., Gritsch, M. and Sedlov, A. (2014), ASME GT2014-25841 --
# "Impact of turbulator design on the heat transfer in a high aspect ratio
# passage of a turbine blade". Alstom (Baden / Moscow). On disk (gitignored):
# sources/heat_transfer/rib/Naik_Retzko_Gritsch_Sedlov_2014_GT2014-25841_TE_wedge_turbulators.pdf
# Record: validation/cooling/extractions/naik_2014_te_wedge_ribs.md.
#
# AN INDEPENDENT LAB, AND A GEOMETRY NO SHIPPED SET WAS FITTED TO. Every
# shipped rib set is Texas A&M (#403 item 2). This is an industrial rig, and
# the passage is a WEDGE (trailing-edge triangle), W/H 6.64 with H at the
# thick leading-edge end -- not a rectangle. So every score here is
# CROSS-SOURCE ACCURACY and OUT OF DOMAIN for every set that scores it
# (docs/VALIDATION_POLICY.md). The harness reports it and tunes nothing.
#
# THE RIG (Table 1, pp. 3-4):
#   * wedge passage, AR = W/H 6.64; ribs on the two wide walls (pressure and
#     suction side), 45 deg to the flow, PS and SS staggered by p/2
#   * angled-tapered: rib height falls along the width with e / local H held
#     constant; P/e 15 average (8 at the LE end), e/Dh 0.089 average (0.163
#     max). Rib cross-section not stated.
#   * broken and chevron: two rows, LE half P/e 15 / e/Dh 0.134, TE half
#     P/e 30 / e/Dh 0.066 (TE row half width)
#   * Re 22k, 60k, 145k on the passage Dh (no numeric Dh, W or H printed)
#   * transient TLC on Perspex over the LAST 3-4 rib pitches; the angled case
#     shows equal line averages at two stations, i.e. fully developed (p. 7)
#   * rib-covered area EXCLUDED from the averages (p. 6-7), so Nu is the mean
#     of the wall BETWEEN the ribs -- not a copper-segment average with the
#     rib surfaces' heat folded in, as Han's rigs measure. Not converted;
#     a difference between rigs, carried by the accuracy label.
#
# THE ORDINATES ARE PRINTED RATIOS ON PRINTED BASELINES (p. 7):
#   Nu/Nu0, Nu0 = 0.023 Re^0.8 Pr^0.4 (Eq. 3, Dittus-Boelter). Pr is not
#     printed (air, 0.70 assumed); a ratio against the sets' own Pr 0.70
#     carries it only through a shared Pr^0.4, as every Nu ratio here does.
#   f/f0 with f = dp / (4 (dL/dh) (1/2) (m/A)^2/rho) (Eq. 4, FANNING passage
#     average) and f0 = 2 [2.236 ln Re - 4.639]^-2 (Eq. 5, Petukhov in Fanning
#     form). y_axis f_ratio_petukhov; conventions.py registers fbar =
#     (f/f0) f0(Re) as a definition.
#
# WHICH WALLS FIG. 16 AVERAGES IS NOT STATED. Declared ribbed-wall
# (Nu_ratio_ribbed_DB): the ribbed PS/SS walls are ~80% of the Fig. 11c
# perimeter, and a by-eye read of the measured line average there (LE wall
# ~1.5 Nu0, TE apex ~2.2, ribbed walls ~2.25) puts a whole-perimeter mean
# ~2-5% BELOW the ribbed-wall mean. If Fig. 16 is the perimeter mean, the
# predictions read that much high against a ribbed-wall truth -- inside the
# 9.5% measurement band, but not nothing. Recorded, not corrected.
#
# UNCERTAINTY. The paper's stated MEASUREMENT figures (Moffat, p. 5): HTC
# +-9.5%, friction factor +-10% (mass flow +-2%, properties +-2%). Those
# are `uncertainty` below. Fig. 16 DRAWS +-15% bars on every point; the
# text does not say what they are (9.5% on h plus the Re terms of Nu0 adds
# to ~10%, not 15%), so the stated figure is used and the drawn bar is
# recorded in the extraction. Neither is derived from any model's error.
#
# FIG. 18 IS MIS-COMPUTED IN THE PAPER. Eq. 6 defines PI = (Nu/Nu0) /
# (f/f0)^(1/3). The 12 REPRINT points reproduce Eq. 6 from their own
# Fig. 16/17 marks to 0.13%; the paper's OWN 8 points do not (24-172% below)
# and instead equal 3 (Nu/Nu0)/(f/f0) to 0.3% -- the spreadsheet precedence
# slip A/(B^1/3), which evaluates as A/((B^1)/3) = 3A/B because ^ binds
# before /. The factor is 3.00 +- 0.01 on all 8. So Fig. 18's own curves (and
# the abstract's "angled gave the best PI") are 3 Nu/f, not Eq. 6. Fig. 18 is
# committed as a CROSS-CHECK on the digitisation of Figs. 16-17 and as the
# record of that error; it is never scored (y_axis performance_index_printed,
# no convention). Pinned by test_naik_fig18_*.
#
# REPRINTS. Figs. 16-18 overplot Rhee, Lee and Cho (2003, GT2003-38622; AR
# 6.82, 45/60 deg V ribs) and Wright, Fu and Han (2004, GT2004-54072; AR 4,
# parallel angled and discrete W ribs). They are committed, labelled
# `reprint_*` with the primary in `after`, and UNSCORED: second-hand, and
# Naik gives neither their e/Dh nor P/e (geometry null, so the Re_Dh path
# refuses them). They carry the Fig. 18 proof that the error is in the
# paper's own column, not in the digitisation.
#
# EXTRACTION (2026-11-09, user-approved on scan overlays: "naik digitization
# looks solid").
#   * Fig. 16 is a RASTER: y calibrated on 7 gridlines (1.0-4.0), worst
#     residual 0.0021 in Nu/Nu0; markers located by their pixel extent.
#     At 60k and 145k the angled circle and chevron triangle overplot: 3 of
#     the 5 marks there were located from the visible edge plus the error-bar
#     cap midpoint (agreeing to 1 px). 1 of 3 angled-tapered marks is clean.
#   * Figs. 17 and 18 are VECTOR: each marker is its own path object with its
#     own colour; centre = path bounding box, mapped by a fit on every
#     labelled tick (y residual <= 0.009 in f/f0, <= 0.0008 in PI).
#   * x is the NOMINAL Re of Table 1 (22k/60k/145k) or of the reprints'
#     legends (10k/20k/30k or 40k). The read abscissae agree within 0.6%
#     (Fig. 16 raster) and 0.3% (vector); they are in the record.
#   * Chevron at 22k: present in Fig. 17 only -- no marker and no error bar
#     in Figs. 16 and 18. A gap in the figure, not in the read.

