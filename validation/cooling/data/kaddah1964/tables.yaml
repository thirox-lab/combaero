# Kaddah (1964) liner air-entry holes: Vol. 1 Tables 11-30, transcribed as printed.
# NOT a schema.py metadata.yaml: these are multi-column printed tables, not
# (x, y) figure series, so load_dataset() does not read them; kaddah_runner.py
# does. Record and self-checks: extractions/kaddah_1964_liner_hole_tables.md.
paper:
  name: kaddah1964
  citation: Kaddah, K. Sh. (1964). Discharge coefficient and jet deflection studies for combustor liner
    air-entry holes. Thesis for the Diploma of Advanced Engineering, Department of Aircraft Propulsion,
    The College of Aeronautics, Cranfield, June 1964. Vol. 1 Tables 11-30 (PDF pages 99-118); Vol. 2 Figs.
    35-103 re-plot them.
  secondary: false
extraction: tabulated
rig:
  duct_width_Y_in: 8.0
  duct_depth_Z_in: 1.25
  test_section_length_in: 18.0
  A1_sq_in: 10.0
  plate: 1/16 in (0.0625 in) aluminium, 16 s.w.g., square-edged holes flush with the duct floor (Section
    7.3)
  wall_thickness_in: 0.0625
  approach_static_in_Hg_abs: 33.0
  p1: approach static at station 2, 7.875 in upstream of the hole centre (Section 7.4.1.1)
  pj: jet static = plenum surrounding pressure (Section 7.4.1.2)
  P1: approach total, pitot at station 3, 6.875 in upstream (Section 7.4.1.3)
definitions:
  C: C = Lj/Lth, Lth = 25 rhoj Vj n Ah [lb/hr, Ah sq.in], rhoj = rho1 (pj/p1)^(1/1.4), Vj = 18.28 sqrt(h/rhoj)
    ft/sec with h the jet dynamic pressure in inches water (App. 2, Eqs. A2.1.1-A2.1.4). The printed Vj
    is reproduced by sqrt(2 g (P1 - pj)/rhoj) at p1 = 33 in Hg (median +0.2%), so h = P1 - pj and C is
    referenced to the approach TOTAL pressure (conventions.py Cd_total).
  K: K = (P1 - pj)/(P1 - p1) = Vj^2/V1^2 incompressible (Section 3.1); computed as (rhoj/rho1) Vj^2/V1^2
    (App. 2). The velocity head ratio of Rohde / TN 3663's Phi.
  alpha: alpha = Lj/L1, bleed ratio, printed in percent
  mu: mu = alpha/a*
  a_star: a* = n Ah/A1, A1 = 8 x 1.25 = 10 sq.in
  phi: angle between the jet axis and the downstream plane of the hole, degrees; 90 = normal jet (Section
    3.1; deflector, Section 7.5)
  delta: momentum-loss factor = Ah (p1' - pj)/(Mj sin phi) = 4.15e4 a* (p1' - pj)/(Lj Vj sin phi); p1'
    (hole-centre static) is not tabulated
  blocks:
    noxflow: 'no cross flow: duct closed downstream, alpha = 100%, V1 the residual feed velocity'
    '80': approach velocity 80 ft/sec
    '130': approach velocity 130 ft/sec
cell_flags:
  file: cell_flags.csv
  sequence_judged: an ambiguous digit (overstruck, faint, overtyped, handwritten) judged from its shape
    and the row sequence; NOT exact. Rows whose scoring inputs carry it are reported separately.
  arithmetic_confirmed: an ambiguous digit where the table's own arithmetic holds for the chosen read
    and fails for every alternative
  printed_inconsistent: the printed value contradicts the table's own arithmetic; kept as printed, the
    arithmetic alternative recorded, and the row excluded from scoring by default
uncertainty: no measurement band for C or phi is stated; manometer error +/-0.1 in water (Section 7.4.1)
