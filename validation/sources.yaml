- file: sources/orifices/hay_lampard_benmansour_1983_JEP_105_243_crossflow_cd.pdf
  sha256: '926756f5b110907d7bda7e3a59cae643ca804221031ef51f840b79571c4692e7'
  citation: 'Hay, N., Lampard, D., Benmansour, S. (1983). Effect of crossflows on the discharge coefficient of film
    cooling holes. ASME J. Engineering for Power 105(2), 243-248 (ASME 82-GT-147).'
  id: ASME 82-GT-147
  topic: [orifice, film]
  content: 'Measured Cd of single rows of sharp-edged holes (D 3.5 mm, S/D 2.5; isothermal, room-temperature air)
    with crossflow on BOTH sides, varied independently: coolant (inlet) Mc 0-0.4 and mainstream (exit) M_inf
    0-0.5, pressure ratio p_c+/p_inf 1-2, Re 1e4-1e5; Table 2 (checked on the rendered page; its L/D column is
    lost in the text layer): parallel flow L/D 2 at 30/60/90 deg and L/D 6 at 30/90 deg, perpendicular L/D 6
    at 30/90 deg. Every figure whose legend gives L/D (Figs. 5, 6, 8-15) is L/D 6; Fig. 7 (vs Rohde, zero
    mainstream crossflow) gives none. 30,
    60, 90 deg, coolant duct parallel (Fig. 3) or perpendicular (Fig. 4) to the mainstream. Cd ideal flow from
    the COOLANT STAGNATION pressure to the mainstream STATIC (p. 245). Uncertainty 6-8% at PR < 1.2, 1.5% above
    1.5 (Table 3). Plotted only (5-12 points per faired curve): Fig. 5 mainstream effect, Fig. 6 coolant effect
    at 90 deg, Figs. 8/12 30 deg, plateau maps Figs. 9, 10, 13, 14, Fig. 15 Cd vs u_j/u_inf. No correlation;
    Fig. 7 agrees with Rohde (TN D-5467) at M_inf 0. Detailed data in Benmansour''s 1981 M.Phil. thesis.'
  status: extracted
  verdict: 'Screened 2026-10-28 (#800/#818, #807, #813). The foundational two-sided crossflow Cd study (Thole et
    al. 1997 cite it as such). For #813: Cd referenced to the coolant TOTAL pressure (as Thole et al.), so the
    supply dynamic head is booked once; even so coolant crossflow moves Cd -- 90 deg: -20% at low PR, -6% on
    the plateau (Fig. 6, Table 4); 30 deg co-aligned: about +30% (Figs. 8, 10); perpendicular layout: lower at
    both angles (Figs. 12-14) -- an angle- and orientation-dependent residual a duct-fed hole model must carry.
    For #818 (exit-side default Rogers & Hersh): cross-source ACCURACY only for u_j/u_inf ~0.25-2 with L/D 6
    holes, never the Gc/Gj ~125 stagnant-row regime; there these thick holes fall BELOW the fit (rough read,
