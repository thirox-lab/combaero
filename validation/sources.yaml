  id: ASME 76-FE-7
  topic: [junction, tee]
  content: 'Continuous (header-averaged) momentum model of dividing, combining, reverse and parallel flow
    manifolds: pressure-flow equation set (Eqs. 16-23) and flow distribution ODE (Eqs. 18, 21, 24), coefficients
