- file: sources/jet_mixing/Holdeman_Smith_Clisset_Lear_2005_NASA_TM-2005-213137_spreadsheet_row_of_jets.pdf
  sha256: '009e4d946bf458511cf0abb5a95ddafd6647b552e39c618e1e1c9e65e0953d88'
  citation: 'Holdeman, J. D., Smith, T. D., Clisset, J. R., Lear, W. E. (2005). A spreadsheet for the mixing of
    a row of jets with a confined crossflow. NASA/TM-2005-213137.'
  id: NASA/TM-2005-213137
  topic: [jet_mixing, combustion]
  content: 'The NASA empirical confined jet-in-crossflow model in full. Eq. 1: Gaussian vertical scalar profile
    in theta = (T_M - T)/(T_M - T_J) about the trajectory with separate half-widths and minima either side;
    Appendix C (pp. 33-35) PRINTS every scaling correlation (trajectory yc/H, theta_c, theta_min+/-, W1/2+/-,
    off-centreplane variation), the superposition rule for double/opposed rows and nonuniform mainstream
    (C3-9), flow-area convergence J(x) = J (H(x)/H)^2 (C3-10) and the slot equivalence (C3-11). Table I (p.
    39) is the validity box: DR 0.5-2.2, J 5-105.6, Cd 0.6-1, x/H 0-2, S/H up to 1, H/d 4-16, A_J/A_M 0.025-0.1,
    C = (S/H) sqrt(J) 0.5-10. Appendices A-B list the original Applesoft BASIC programs; Table 2 cross-references
    each calculated case to the measured data in refs. 5, 11, 14, 15 (Holdeman-Walker, Srinivasan et al.).
    Figures are MODEL output, not data.'
  status: screened
  verdict: 'Screened 2026-10-28: the model document the 2011 slanted-slot TM points to (formerly named as
    wanted in that entry). Plugs the jet-mixing gap fully on the MODEL side -- everything needed to implement
    a rectangular-duct jet-in-crossflow mixing kernel (the planned future element, no issue yet) is printed,
    with an explicit validity box. Not a fidelity set: its figures are the model''s own output; fidelity needs
    the measured profiles of refs. 5/11/14/15 (Holdeman & Walker 1977 NASA TM X-73582 lineage), which are not
    held. Rectangular, non-curving duct only (the can case is TM-107185, registered).'
  read_for: ['jet-in-crossflow mixing (future element): the empirical model and its validity range']
  issues: []
  records: []
  notes: Arrived 2026-10-28 as docs/new/A_Spreadsheet_for_the_Mixing_of_a_Row_of.pdf. 91 pp.; text layer
    clean.
