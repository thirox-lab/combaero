- file: sources/radiation/Rudey_Graham_1984_NASA-TM-83341_combustor_turbine_heat_transfer_review.pdf
  sha256: '7ecdf0cc13b43cc565c0a46d00eebc458285b44a82f4bb305841fbf713591bfe'
  citation: 'Rudey, R. A., Graham, R. W. (1984). A review of NASA combustor and turbine heat transfer research.
    NASA TM-83341, prepared for the 29th ASME International Gas Turbine Conference, Amsterdam, 3-7 June 1984.'
  id: NASA-TM-83341 (NTRS 19840006078, N84-14146)
  topic: [radiation, combustion, review]
  content: 'Open access (NTRS), 26 pp., CASI scan with a usable text layer. Programme review of NASA Lewis/HOST
    hot-section heat transfer. Combustor part (pp. 3-5): the two factors that set liner heat load are inlet
    pressure and flame luminosity. Fig. 4(a) CALCULATED liner heat loads (radiation, convection, net) for Jet A
    and a low-hydrogen fuel against P3 0-20 MPa (radiation to ~23 W/cm2 at 20 MPa); Fig. 4(b) h against
    pressure 0.3-1.5 MPa, points and an "estimated" line. Fig. 5 (from Humenik, Claus & Neely, NASA TM-83436)
    MEASURED vs PREDICTED radiant heat flux at three axial stations (primary, secondary, tertiary) of a
    tubular-can combustor at idle (F/A 0.007, T3 400 K, P3 269 kPa), cruise (0.014, 620 K, 700 kPa) and take-off
    (0.018, 715 K, 1740 kPa); measured roughly 5, 45/40/20 and 80/75/20 W/cm2 (read from the plot, not
    digitised); the predictions (Srivatsa, NASA CR-167930) are up to two-fold high in the secondary zone. Text:
    spectral radiometry shows soot dominates radiant energy, and a fuel ~2 percentage points lower in H content
    than Jet A gives markedly higher flame temperature and radiance. Fig. 9: a GE contract rig for liner cooling
    concepts x flame radiation (data base planned, no report number given). Turbine part not relevant here.'
  status: screened
  verdict: 'Screened 2026-11-02. Secondary; no closure. Its value is the pointer: the measured tubular-can
    radiation and liner data it summarises are NASA TM-83436 (Humenik, Claus & Neely 1983) and NASA TM-83538 /
    AIAA 84-0443 (Claus, Neely & Humenik), both public on NTRS -- 0.34-2.07 MPa, 533-700 K, F/A 0.008-0.021,
    Jet A (13.9% H) and ERBS (12.9% H), total and spectral radiometers at three stations plus liner
    temperatures. That pair is the best candidate seen so far to FALSIFY a combaero luminous-radiation model
    (measured radiant flux against pressure and fuel H content; cross-source for Lefebvre''s L = 336/H^2).
    Fig. 5 here is too coarse to score against (three stations, read by eye, no geometry). Not checked: the
    turbine sections.'
  read_for: ['#793 measured combustor radiant heat flux (validation candidate for a luminous gas-radiation model)']
  issues: [793]
  records: []
  notes: Arrived 2026-11-02 in sources/new/radiation/ as 19840006078.pdf. Ref. 2 (AIAA 84-0443) and ref. 3 (TM-83436)
    are the primaries; NTRS 19840005120 (TM-83538) and 19830020966 (TM-83436) have PDF downloads.
- file: sources/radiation/Howell_Menguc_Daun_Siegel_2021_TRHT7_online_appendices.pdf
  sha256: 'bc8fb9f388606d277f66309e390a06db8a9e0f6c374beadf59950cf4e77dcbcf'
  citation: 'Howell, J. R., Menguc, M. P., Daun, K., Siegel, R. (2021). On-line appendices to Thermal Radiation
    Heat Transfer, 7th ed., Taylor and Francis / CRC Press (appendix file dated 2024-07-05).'
  id: TRHT 7th ed. on-line appendices A-R
  topic: [radiation, review]
  content: 'Free on-line supplement to the textbook, 200 pp., Word text layer. Relevant parts. App. B (pp. B.1-B.16):
    derivation of geometric mean beam lengths (hemisphere, cylinder top/side to base centre, sphere, parallel
    plates, rectangles; Tables B.1/B.2 Dunkle 1964 beam-length ratios), and Example B.2 using the usual Le =
    0.9 x 4V/A. App. F (pp. F.1-F.13): Alberti, Weber & Mancini 2018 HITEMP-2010 emittance charts for H2O, CO2
    and CO with pressure and overlap corrections, 300-3000 K and 0.1-100 atm; mixture eps = eps_H2O + eps_CO2 +
    eps_CO - overlaps (Eq. F.1); equivalent pressures P_E,H2O = P (1 + 5.00 x_H2O), P_E,CO2 = P (1 + 0.28
    x_CO2) (Eq. F.2); said to be within 1% of LBL; Example F.1 (Le 2.4 m) gives 0.401. App. K (pp. K.1-K.4):
    flame radiation, mostly qualitative; Example K.1 (ethane, 100% excess air, 1853 K, 1 atm, 4 m x 2 m
    cylinder, Le = 0.9 x 4V/A = 1.44 m, eps_g 0.1451, Q 3050 kW); Table K.1 adiabatic flame temperatures; cites
    Lefebvre 1984 IJHMT and Taylor & Foster 1974 for luminous flames. App. H: RTE benchmark tables (cube,
    cylinder). App. A: Edwards wide-band model. Main-text equations (Ch. 9 gas properties, Eq. 11.104 Le) are
    referenced but not in this file.'
  status: screened
  verdict: 'Screened 2026-11-02. Background and a strong lead, no closure of its own. Mean beam length: the
    appendix derives the geometric factors; the engineering value combaero needs (Le = 0.9 x 4V/A, i.e. 3.6
    V/A, against Lefebvre Eq. 8.10''s 3.4 V/A after Fishenden & Saunders) is the textbook''s, so either value is
    sourced; the 6% difference is a model choice to state. App. F names the pressure-capable, closed-form
    alternative to Bordbar 2021 that is NOT under a non-commercial licence as far as seen: Alberti, Weber &
    Mancini 2018/2020 (JQSRT 219, 274-291; JQSRT 255, 107227) curve fits to 100 atm, with a public
    spreadsheet -- wanted. The charts themselves are not digitised and should not be (curve fits exist).
    Example K.1 is a one-number check of a gas-emissivity kernel (accuracy, not fidelity: Alberti spreadsheet
    vs whatever combaero implements). Not checked: Apps. C-E, G, I, J, L-R.'
  read_for: ['#793 mean beam length', '#793 non-luminous emissivity at pressure (lead to Alberti et al.)']
  issues: [793]
  records: []
  notes: Arrived 2026-11-02 in sources/new/radiation/ as "On-line appxs 7th ed 7-5-2024.pdf". Copyrighted
