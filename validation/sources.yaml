- file: sources/heat_transfer/film/Andreini_2017_IJTS_121_75_effusion_angle_three_sector_swirl_PSP.pdf
  sha256: '911fccc97c53a56b413b46710235ff45ea69780145525735ce8796a8bfb0e585'
  citation: Andreini, A., Becchi, R., Facchini, B., Picchi, A., Peschiulli, A. (2017). The effect of effusion
    holes inclination angle on the adiabatic film cooling effectiveness in a three-sector gas turbine combustor
    rig with a realistic swirling flow. Int. J. Thermal Sciences 121, 75-88. doi:10.1016/j.ijthermalsci.2017.07.003
    (University of Florence FLORE accepted-manuscript preprint, 28 pp.)
  topic:
  - effusion
  - film
  content: 'Open access accepted manuscript (LEMCOTEC), text layer. Planar three-sector non-reacting rig at
    ambient p and T, three GE-Avio PERM radial double-swirl injectors (SN 0.75 design, 0.77 by CFD,
    expansion ratio 2.5), swirler dp/P 3.5 %, Re_main 160000 on Dh (Dh/d 260). Effusion plate is the LINER
    (inner wall, mainstream along it); the dome carries only a 5 mm starter slot (W = 0 or 3 %). Three plates,
    cylindrical holes only, alpha 20, 30, 90 deg; 1184 holes, 23 staggered rows, d 1.65 mm, Sx/d 7.64
    (streamwise), Sy/d 6, porosity 1.17 % (Fig. 2); plate thickness / L/d NOT printed. Plate dp/P 1, 2, 3 %,
    Re_eff 0-4000, DR 1 (N2 tracer), local BR from PIV wall-plane velocity 1.5 to 4-5 (Fig. 12, plotted). PSP
    adiabatic effectiveness maps (Fig. 10, 13), laterally averaged eta vs x/Sx for 3 angles x 3 dp plus slot
    (Fig. 11), lateral profiles at x/Sx 1.5, 6.5, 15.5 (Fig. 14), PIV (Figs. 6-9), and Fig. 15: L''Ecuyer-Soechting
    and Colban 2011 correlations with Sellers superposition vs the swirl data AND vs same-hardware data with
    the swirlers removed (uniform mainstream, BR 2.0, 20 and 30 deg only). Plate flow check: Cd about 0.67 for
    20 and 30 deg, about 0.75 for 90 deg (text only, no Re or dp dependence). Uncertainty: eta 10 % at 0.2,
    3 % above 0.8 (Kline-McClintock); flows 5-6 %; PIV 3 %. Everything plotted, nothing tabulated except
    Table 1 (test matrix).'
  status: screened
  verdict: 'Screened 2026-11-08. Gives what the wanted question asked, as plots: adiabatic eta under real
    swirl at three hole angles and three plate dp. Swirl puts the eta minimum at the swirl-jet stagnation
    (x/Sx about 7, local BR 4-5) and reverse flow under the corner vortex; downstream of x/Sx 9-10 the eta growth
    rate matches flat-plate superposition. 20 deg beats 30 deg by about 30 % (averaged); 90 deg is only competitive
    in the corner region. Authors'' own check (Fig. 15): L''Ecuyer-Soechting and Colban + Sellers match the
    uniform-mainstream plate and fail upstream of rows 6-7 under swirl. Does NOT give: a plate facing the
    burners (liner only; the dome has a slot, not effusion), any gas-side h, any shaped hole, DR above 1, plate
    thickness/L/d, tabulated data. Cd: two plate-level values (0.67 slant, 0.75 normal) without L/d or Re --
    a qualitative angle trend only, weaker than Hay 1983 / Gritsch 1998. Accuracy use (cross-source, after
    digitising): the uniform-mainstream BR 2.0 curves of Fig. 15 are a multi-row cylindrical-hole set for the
    film kernels combaero ships with superposition (L''Ecuyer-type, Colban as applied to round holes, which has no
    angle term); the swirl curves are a bound on how far upstream of the swirl stagnation those kernels can be
    trusted, needing the plotted BR(x) of Fig. 12 as input. Not an overall-effectiveness or in-hole check
    (adiabatic, ambient).'
  read_for:
  - 'can-annular front plate with several burners -- not here (liner downstream of three swirlers, dome slot only)'
  - 'effusion adiabatic effectiveness under swirl vs flat-plate kernels and hole angle (wanted 2026-11-08) -- here, plotted'
  issues: []
  records: []
  notes: 'Digitising candidates: Fig. 15 (uniform-mainstream 20/30 deg data at BR 2.0 plus the swirl data and
    the two correlations, the one figure that separates swirl from kernel error); Fig. 11 (laterally averaged
    eta, 3 angles x 3 dp, slot on/off); Fig. 12 (reference BR vs x/Sx, needed to drive any kernel). The 30 deg
    plate is the one of Andreini et al. 2015 JEGTP 138 031506 (ref. 28; also heat transfer coefficient in
    Andreini et al. 2014 J. Turbomach. 137 031012, ref. 27 -- the latter is the Florence swirl-rig HTC
    measurement and a lead for #476). Arrived 2026-11-08 in sources/new/oa_swirl_1108/ as
    LEMCOTEC_Journal2016_pre-print.pdf.'

- file: sources/heat_transfer/film/Lenzi_2020_Energies_13_4993_effusion_cyl_vs_shaped_swirl_TRPIV.pdf
  sha256: '556c99c7e1bab36de74b607bf170ec2b1516c745f21fce2142139ae0bb18d7df'
  citation: Lenzi, T., Picchi, A., Bacci, T., Andreini, A., Facchini, B. (2020). Unsteady flow field
    characterization of effusion cooling systems with swirling main flow - comparison between cylindrical
    and shaped holes. Energies 13(19), 4993. doi:10.3390/en13194993
  topic:
